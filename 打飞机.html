<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际猎手 - 2D 射击游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #cfe3ff;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: min(800px, calc(100vw - 24px));
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #060a14;
    border: 2px solid #1e3a5f;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(30, 90, 200, 0.25);
  }
  #hint {
    margin-top: 10px;
    text-align: center;
    font-size: clamp(10px, 2.8vw, 13px);
    color: #7f9bc4;
    line-height: 1.7;
  }
  kbd {
    background: #16233c;
    border: 1px solid #2c4a77;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
    color: #a8d0ff;
  }
  @media (max-width: 480px) {
    #hint { margin-top: 6px; }
    kbd { padding: 1px 4px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hint">
    <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 移动 &nbsp;·&nbsp;
    <kbd>↑</kbd><kbd>↓</kbd> / <kbd>W</kbd><kbd>S</kbd> 上下移动 &nbsp;·&nbsp;
    飞船全自动射击 &nbsp;·&nbsp; <kbd>空格</kbd> 发射激光 &nbsp;·&nbsp; <kbd>X</kbd> 投掷炸弹 &nbsp;·&nbsp; <kbd>Esc</kbd> 暂停 &nbsp;·&nbsp; <kbd>R</kbd> 重新开始
  </div>
</div>

<script>
"use strict";

/* ============================================================
 * 星际猎手 —— 一个简单的 2D 纵版射击游戏
 * - 玩家飞船：方向键 / WASD 移动，全自动射击
 * - 敌人：多种类型，各有血量（头顶显示血条），打光血量即消灭
 * - 波次系统：每波敌人更多、更快、更肉
 * ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

// ---------- 游戏状态 ----------
let game = null;
let killAudioTemplate = null;
let bombAudioTemplate = null;
let backgroundAudio = null;
let soundContext = null;
let soundMasterGain = null;
const audioSettings = {
  bgmVolume: 0.72,
  bgmMuted: false,
  effectsVolume: 0.72,
  effectsMuted: false,
};
const activeAudioNodes = new Set();

function effectiveBgmVolume() {
  return audioSettings.bgmMuted ? 0 : audioSettings.bgmVolume;
}

function effectiveEffectsVolume() {
  return audioSettings.effectsMuted ? 0 : audioSettings.effectsVolume;
}

function setBgmVolume(value, unmute = false) {
  audioSettings.bgmVolume = clamp(value, 0, 1);
  if (unmute) audioSettings.bgmMuted = false;
  if (backgroundAudio) {
    backgroundAudio.volume = backgroundAudio.baseVolume * effectiveBgmVolume();
    if (effectiveBgmVolume() <= 0) backgroundAudio.pause();
    else if (game && !game.paused && game.waveState !== "gameover") startBackgroundMusic();
  }
}

function setEffectsVolume(value, unmute = false) {
  audioSettings.effectsVolume = clamp(value, 0, 1);
  if (unmute) audioSettings.effectsMuted = false;
  for (const sound of activeAudioNodes) sound.volume = sound.baseVolume * effectiveEffectsVolume();
  if (soundMasterGain && soundContext) {
    soundMasterGain.gain.setTargetAtTime(effectiveEffectsVolume(), soundContext.currentTime, 0.01);
  }
}

function toggleBgmMute() {
  audioSettings.bgmMuted = !audioSettings.bgmMuted;
  setBgmVolume(audioSettings.bgmVolume);
}

function toggleEffectsMute() {
  audioSettings.effectsMuted = !audioSettings.effectsMuted;
  setEffectsVolume(audioSettings.effectsVolume);
}

function createAudioTemplate(src, volume, channel = "effects") {
  const audio = new Audio(src);
  audio.preload = "auto";
  audio.baseVolume = volume;
  audio.audioChannel = channel;
  audio.volume = volume * (channel === "bgm" ? effectiveBgmVolume() : effectiveEffectsVolume());
  audio.load();
  return audio;
}

function ensureAudio() {
  if (!killAudioTemplate) {
    killAudioTemplate = createAudioTemplate("assets/kill-sound.wav", 0.72);
  }
  if (!bombAudioTemplate) bombAudioTemplate = createAudioTemplate("assets/bomb-explosion.wav", 0.78);
  if (!backgroundAudio) {
    backgroundAudio = createAudioTemplate("assets/background-music.mp3", 0.3, "bgm");
    backgroundAudio.loop = true;
  }
  startBackgroundMusic();
  return killAudioTemplate;
}

function startBackgroundMusic() {
  if (!backgroundAudio || effectiveBgmVolume() <= 0 || (game && (game.paused || game.waveState === "gameover"))) return;
  backgroundAudio.volume = backgroundAudio.baseVolume * effectiveBgmVolume();
  backgroundAudio.play().catch(() => {});
}

function pauseBackgroundMusic() {
  if (backgroundAudio) backgroundAudio.pause();
}

function playAudioTemplate(template) {
  if (!template) return;
  const sound = template.cloneNode();
  sound.baseVolume = template.baseVolume;
  sound.audioChannel = template.audioChannel;
  sound.volume = sound.baseVolume * effectiveEffectsVolume();
  activeAudioNodes.add(sound);
  sound.addEventListener("ended", () => activeAudioNodes.delete(sound), { once: true });
  sound.play().catch(() => activeAudioNodes.delete(sound));
}

function playKillSound() {
  playAudioTemplate(ensureAudio());
}

function playBombSound() {
  ensureAudio();
  playAudioTemplate(bombAudioTemplate);
}

function ensureSoundContext() {
  if (!soundContext) {
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCtor) return null;
    soundContext = new AudioContextCtor();
    soundMasterGain = soundContext.createGain();
    soundMasterGain.gain.value = effectiveEffectsVolume();
    soundMasterGain.connect(soundContext.destination);
  }
  if (soundContext.state === "suspended") soundContext.resume().catch(() => {});
  return soundContext;
}

function playLaserSound() {
  const audio = ensureSoundContext();
  if (!audio) return;
  const now = audio.currentTime;
  const mix = audio.createGain();
  const filter = audio.createBiquadFilter();
  mix.gain.setValueAtTime(0.5, now);
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(2600, now);
  filter.Q.setValueAtTime(1.2, now);
  mix.connect(filter);
  filter.connect(soundMasterGain);

  // 先蓄能再放电，形成有重量的科幻激光发射感。
  const charge = audio.createOscillator();
  const chargeGain = audio.createGain();
  charge.type = "triangle";
  charge.frequency.setValueAtTime(145, now);
  charge.frequency.exponentialRampToValueAtTime(480, now + 0.14);
  chargeGain.gain.setValueAtTime(0.0001, now);
  chargeGain.gain.exponentialRampToValueAtTime(0.09, now + 0.012);
  chargeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
  charge.connect(chargeGain);
  chargeGain.connect(mix);
  charge.start(now); charge.stop(now + 0.18);

  const zap = audio.createOscillator();
  const zapGain = audio.createGain();
  zap.type = "sawtooth";
  zap.frequency.setValueAtTime(920, now + 0.035);
  zap.frequency.exponentialRampToValueAtTime(250, now + 0.19);
  zapGain.gain.setValueAtTime(0.0001, now + 0.035);
  zapGain.gain.exponentialRampToValueAtTime(0.075, now + 0.045);
  zapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
  zap.connect(zapGain);
  zapGain.connect(mix);
  zap.start(now + 0.035); zap.stop(now + 0.2);
}

const PLAYER_LASER_HIT_RADIUS = 18;

// ---------- 工具函数 ----------
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function easeInCubic(t) { return t * t * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}
function roundedRectPath(x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}
// 点到线段的最短距离（用于激光命中判定）
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return Math.hypot(px - cx, py - cy);
}

// ---------- 粒子系统（爆炸 / 火花） ----------
class Particle {
  constructor(x, y, vx, vy, life, size, color) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.size = size; this.color = color;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= dt;
  }
  draw() {
    const a = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---------- 漂浮文字（金币、状态提示等） ----------
class FloatText {
  constructor(x, y, text, color, size = 14) {
    this.x = x; this.y = y;
    this.text = text; this.color = color; this.size = size;
    this.life = 0.8; this.maxLife = 0.8;
  }
  update(dt) { this.y -= 40 * dt; this.life -= dt; }
  draw() {
    const a = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `bold ${this.size}px "Segoe UI", sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = this.color;
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1;
  }
}

// ---------- 子弹 ----------
class Bullet {
  constructor(x, y, vx, vy, damage, color = "#7ef0ff", r = 3) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.damage = damage;
    this.color = color;
    this.r = r;
    this._dead = false;
  }
  update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; }
  draw() {
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  get dead() { return this._dead || this.y < -20 || this.y > H + 20 || this.x < -20 || this.x > W + 20; }
  set dead(v) { this._dead = v; }
}

// ---------- 敌人 ----------
const ENEMY_TYPES = {
  scout: { name: "侦察机", hp: 1,  r: 14, speed: 280, gold: 10,  color: "#ff6b6b",  fireRate: 0, burstChance: 0 },
  grunt: { name: "步兵机", hp: 3,  r: 18, speed: 75,  gold: 20,  color: "#ffa94d",  fireRate: 2.0, burstChance: 0 },
  tank:  { name: "装甲机", hp: 9,  r: 26, speed: 38,  gold: 50,  color: "#c0a0ff",  fireRate: 3.0, burstChance: 1, burst: { min: 3, max: 6 } },
  spinner: { name: "环射机", hp: 9, r: 22, speed: 60, gold: 60, color: "#57e3b5", fireRate: 4.4, burstChance: 0, radial: { count: 14, duration: 1.0, speed: 130 } },
  elite: { name: "精英机", hp: 40, r: 32, speed: 45,  gold: 120, color: "#ff5ec8",  fireRate: 2.4, burstChance: 0 },
};

class Enemy {
  constructor(type, x, y) {
    const t = ENEMY_TYPES[type];
    this.type = type;
    this.name = t.name;
    this.maxHp = t.hp;
    this.hp = t.hp;
    this.r = t.r;
    this.speed = t.speed;
    this.gold = t.gold;
    this.color = t.color;
    this.x = x; this.y = y;
    // 高级敌机停留在更靠上的安全区域，给玩家留下观察和躲避弹幕的距离。
    const staysUpper = type === "tank" || type === "spinner" || type === "elite";
    this.phase = "enter";
    this.enterY = staysUpper ? rand(65, H * 0.34) : rand(70, H * 0.45);
    this.wobble = rand(0, Math.PI * 2);
    this.wobbleSpeed = type === "elite" ? rand(0.55, 0.9) : rand(1.2, 2.4);
    this.wobbleAmp = type === "elite" ? rand(16, 32) : rand(20, 60);
    this.fireTimer = rand(0.8, 2);
    this.flash = 0; // 受击闪白
    this.burst = 0;      // 连射剩余颗数
    this.burstTimer = 0; // 连射间隔计时
    this.charge = 0;     // 激光蓄力剩余时间（前摇）
    this.laser = 0;      // 激光持续剩余时间
    this.laserDir = { x: 0, y: 1 };
    this.lockX = 0; this.lockY = 0; // 蓄力时锁定的目标位置
    this.radialShots = 0;       // 环形弹幕剩余子弹数
    this.radialTimer = 0;       // 下一颗环形子弹的发射计时
    this.radialAngle = 0;       // 下一颗环形子弹的方向
    this.radialStartAngle = 0;  // 环形弹幕起始方向，用于绘制释放进度
    this.radialStep = 0;
    this.gone = false;   // 侦察机飞出屏幕标记
    this.facing = Math.PI / 2; // 机头朝向（默认朝下，每帧转向玩家）
  }

  // 机头位置（用于开火 / 激光 / 绘制）
  nose() {
    return { x: this.x + Math.cos(this.facing) * this.r, y: this.y + Math.sin(this.facing) * this.r };
  }

  update(dt, game) {
    if (this.type === "scout") {
      // 侦察机：只会直线俯冲，不左右移动，飞出屏幕即消失
      this.y += this.speed * dt;
      if (this.y > H + 40) this.gone = true;
    } else if (this.phase === "enter") {
      this.y += this.speed * dt;
      if (this.y >= this.enterY) { this.y = this.enterY; this.phase = "battle"; }
    } else {
      this.x += Math.cos(this.wobble) * this.wobbleAmp * dt * 1.6;
      this.wobble += this.wobbleSpeed * dt;
      // 装甲机/环射机/精英机停留在屏幕上方持续攻击；其余缓慢向玩家逼近。
      if (game.player && this.type !== "tank" && this.type !== "spinner" && this.type !== "elite") {
        this.y += this.speed * 0.35 * dt;
      }
      if (this.y > H + 40) {
        if (game.waveState === "bossWarmup") this.gone = true;
        else this.y = -40; // 普通波次循环
      }
    }
    // 边界反弹（摇摆时不出界）
    if (this.x < this.r + 10) { this.x = this.r + 10; this.wobble = Math.PI - this.wobble; }
    if (this.x > W - this.r - 10) { this.x = W - this.r - 10; this.wobble = Math.PI - this.wobble; }
    this.flash = Math.max(0, this.flash - dt * 6);

    // 机头朝向（侦察机固定朝下，其余朝向玩家）
    if (game.player) {
      const target = this.type === "scout" ? Math.PI / 2 : Math.atan2(game.player.y - this.y, game.player.x - this.x);
      let diff = target - this.facing;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      this.facing += diff * Math.min(1, dt * 6);
    }

    // ---- 攻击逻辑 ----
    const enemyCfg = ENEMY_TYPES[this.type];
    const fr = enemyCfg.fireRate;
    const burstChance = enemyCfg.burstChance || 0;
    const burstCfg = enemyCfg.burst;
    const canFire = game.player && this.y > 0; // 一入场（进入屏幕）即可准备攻击
    if (fr > 0 && canFire) {
      if (this.type === "elite") {
        // 精英机只使用锁定激光：1 秒前摇 -> 发射 -> 冷却。
        if (this.charge > 0) {
          this.charge -= dt;
          if (this.charge <= 0) {
            // 蓄力完成，发射激光
            this.laser = 0.35;
            const n = this.nose();
            const dx = this.lockX - n.x, dy = this.lockY - n.y;
            const len = Math.hypot(dx, dy) || 1;
            this.laserDir = { x: dx / len, y: dy / len };
            this.fireTimer = rand(2.2, 3.2); // 冷却后再蓄力
          }
        } else if (this.laser > 0) {
          this.laser -= dt;
          // 激光命中检测（配合玩家无敌帧，一次激光最多打一下）
          const n = this.nose();
          const ox = n.x, oy = n.y;
          const ex2 = ox + this.laserDir.x * 1000, ey2 = oy + this.laserDir.y * 1000;
          if (distToSegment(game.player.x, game.player.y, ox, oy, ex2, ey2) < 8 + game.player.r) {
            game.player.hit(25);
          }
        } else {
          this.fireTimer -= dt;
          if (this.fireTimer <= 0) {
            this.charge = 1.0;
            this.lockX = game.player.x;
            this.lockY = game.player.y;
          }
        }
      } else if (this.type === "spinner") {
        // 环射机：14 发子弹在 1 秒内沿顺时针方向依次覆盖一整圈。
        this.fireTimer -= dt;
        if (this.radialShots > 0) {
          const radial = enemyCfg.radial;
          this.radialTimer -= dt;
          // 帧率波动时允许单帧补发，确保整轮仍能在 1 秒内完成。
          while (this.radialTimer <= 0 && this.radialShots > 0) {
            const angle = this.radialAngle;
            const bx = this.x + Math.cos(angle) * this.r * 0.55;
            const by = this.y + Math.sin(angle) * this.r * 0.55;
            game.enemyBullets.push(new Bullet(
              bx, by,
              Math.cos(angle) * radial.speed,
              Math.sin(angle) * radial.speed,
              5, "#63f2c1", 4
            ));
            this.radialShots--;
            this.radialAngle += this.radialStep;
            this.radialTimer += radial.duration / radial.count;
          }
        } else if (this.fireTimer <= 0) {
          const radial = enemyCfg.radial;
          this.radialShots = radial.count;
          this.radialTimer = 0;
          this.radialStartAngle = rand(0, Math.PI * 2);
          this.radialAngle = this.radialStartAngle;
          this.radialStep = Math.PI * 2 / radial.count;
          this.fireTimer = fr;
        }
      } else {
        // 步兵机固定单发；装甲机每 3 秒必定进行一次连射。
        this.fireTimer -= dt;
        if (this.burst > 0) {
          // 连射中：按间隔连续发射
          this.burstTimer -= dt;
          if (this.burstTimer <= 0) {
            this.burstTimer = 0.09;
            this.burst--;
            game.enemyBullets.push(game.spawnEnemyBullet(this.nose().x, this.nose().y, game.player));
          }
        } else if (this.fireTimer <= 0) {
          this.fireTimer = fr;
          if (burstCfg && Math.random() < burstChance) {
            this.burst = randInt(burstCfg.min, burstCfg.max);
            this.burstTimer = 0; // 立即打出第一颗
          } else {
            game.enemyBullets.push(game.spawnEnemyBullet(this.nose().x, this.nose().y, game.player));
          }
        }
      }
    }
  }

  draw() {
    const t = ENEMY_TYPES[this.type];
    // 主体（精英机蓄力时变橙提示）
    let bodyColor = t.color;
    if (this.type === "elite" && this.charge > 0) bodyColor = "#ff7043";
    // 机体：旋转使机头朝向玩家（血条/激光特效保持水平绘制）
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing + Math.PI / 2);
    ctx.fillStyle = this.flash > 0 ? "#ffffff" : bodyColor;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -this.r);
    ctx.lineTo(this.r * 0.9, this.r * 0.6);
    ctx.lineTo(this.r * 0.4, this.r * 0.9);
    ctx.lineTo(-this.r * 0.4, this.r * 0.9);
    ctx.lineTo(-this.r * 0.9, this.r * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // 座舱
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.15, this.r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // 精英机激光特效（前摇预警线 + 激光本体）
    if (this.type === "elite") {
      const n = this.nose();
      const ox = n.x, oy = n.y;
      if (this.charge > 0) {
        // 1 秒前摇：闪烁的红色预警线，指向锁定位置
        const dx = this.lockX - ox, dy = this.lockY - oy;
        const len = Math.hypot(dx, dy) || 1;
        const ex2 = ox + (dx / len) * 1000, ey2 = oy + (dy / len) * 1000;
        const alpha = 0.25 + 0.45 * Math.abs(Math.sin(this.charge * 14));
        ctx.strokeStyle = `rgba(255, 90, 60, ${alpha.toFixed(3)})`;
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]);
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ex2, ey2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (this.laser > 0) {
        // 激光本体：亮红粗线 + 白芯
        const ex2 = ox + this.laserDir.x * 1000, ey2 = oy + this.laserDir.y * 1000;
        ctx.shadowColor = "#ff3b30";
        ctx.shadowBlur = 20;
        ctx.strokeStyle = "#ff5a3c";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ex2, ey2);
        ctx.stroke();
        ctx.strokeStyle = "#fff6e0";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
    // 环射机释放弹幕时显示顺时针进度光环。
    if (this.type === "spinner" && this.radialShots > 0) {
      const ringR = this.r + 9;
      const pulse = 0.55 + 0.35 * Math.sin(this.radialShots * 1.8);
      ctx.strokeStyle = `rgba(99, 242, 193, ${pulse.toFixed(3)})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = "#63f2c1";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(this.x, this.y, ringR, this.radialStartAngle, this.radialAngle);
      ctx.stroke();
      ctx.fillStyle = "#effff9";
      ctx.beginPath();
      ctx.arc(
        this.x + Math.cos(this.radialAngle) * ringR,
        this.y + Math.sin(this.radialAngle) * ringR,
        3.5, 0, Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  hit(damage) {
    this.hp -= damage;
    this.flash = 1;
    return this.hp <= 0;
  }
}

// ---------- BOSS：星蚀母舰 ----------
// BOSS 使用独立状态机，但复用游戏现有的子弹、粒子和碰撞管线。
class Boss {
  constructor() {
    this.x = W / 2;
    this.targetY = 125;
    this.y = -180;
    this.entering = true;
    this.entranceElapsed = 0;
    this.entranceDuration = 2.4;
    this.maxHp = 1000;
    this.hp = this.maxHp;
    this.hitRadius = 205;
    this.phase = 1;
    this.time = 0;
    this.attackCooldown = rand(1.2, 1.6);
    this.attack = null;
    this.attackIndex = 0;
    this.hitFlash = 0;
    this.damagePulse = 0;
    this.defeated = false;
    this.deathTimer = 0;
  }

  get healthRatio() { return clamp(this.hp / this.maxHp, 0, 1); }

  hitEllipses(padding = 0) {
    const visualScale = 0.66;
    return [
      { rx: 470 * visualScale + padding, ry: 116 * visualScale + padding },
      { rx: 136 * visualScale + padding, ry: 184 * visualScale + padding },
    ];
  }

  containsPoint(x, y, padding = 0) {
    const localX = x - this.x;
    const localY = y - this.y;
    return this.hitEllipses(padding).some(({ rx, ry }) => (localX / rx) ** 2 + (localY / ry) ** 2 <= 1);
  }

  collidesCircle(x, y, radius = 0) {
    return this.containsPoint(x, y, radius);
  }

  segmentImpact(ax, ay, bx, by, padding = 0) {
    const startX = ax - this.x;
    const startY = ay - this.y;
    const dx = bx - ax;
    const dy = by - ay;
    let firstT = Infinity;

    for (const { rx, ry } of this.hitEllipses(padding)) {
      const c = (startX / rx) ** 2 + (startY / ry) ** 2 - 1;
      if (c <= 0) {
        firstT = 0;
        continue;
      }
      const a = (dx / rx) ** 2 + (dy / ry) ** 2;
      if (a <= Number.EPSILON) continue;
      const b = 2 * (startX * dx / (rx * rx) + startY * dy / (ry * ry));
      const discriminant = b * b - 4 * a * c;
      if (discriminant < 0) continue;
      const t = (-b - Math.sqrt(discriminant)) / (2 * a);
      if (t >= 0 && t <= 1) firstT = Math.min(firstT, t);
    }

    if (!Number.isFinite(firstT)) return null;
    return { x: ax + dx * firstT, y: ay + dy * firstT, t: firstT };
  }

  update(dt, game) {
    this.time += dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt * 6);
    this.damagePulse = Math.max(0, this.damagePulse - dt * 4);

    if (this.defeated) {
      this.deathTimer += dt;
      if (Math.random() < dt * 5) game.explosion(this.x + rand(-260, 260), this.y + rand(-80, 100), "#ff586b", 0.55);
      return;
    }

    if (this.entering) {
      this.entranceElapsed += dt;
      const progress = clamp(this.entranceElapsed / this.entranceDuration, 0, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      this.y = -180 + (this.targetY + 180) * eased;
      if (Math.random() < dt * 18) {
        for (const side of [-1, 1]) {
          game.addParticles(this.x + side * 62, this.y - 92, this.phase === 3 ? "#ff596a" : "#65eaff", 1, 0.32);
        }
      }
      if (progress >= 1) {
        this.y = this.targetY;
        this.entering = false;
        this.attackCooldown = rand(1.2, 1.6);
        game.waveState = "boss";
        game.screenShake = Math.max(game.screenShake, 0.42);
        game.explosion(this.x, this.y + 62, this.phase === 3 ? "#ff596a" : "#65eaff", 0.72);
      }
      return;
    }

    this.phase = this.healthRatio <= 0.33 ? 3 : this.healthRatio <= 0.66 ? 2 : 1;

    if (this.attack) this.updateAttack(dt, game);
    else {
      this.attackCooldown -= dt;
      if (this.attackCooldown <= 0) this.startAttack(game);
    }
    this.updateProjectiles(dt, game);
  }

  startAttack(game) {
    const phasePatterns = {
      1: ["cross", "radial", "fan", "delay"],
      2: ["cross", "parallel", "radial", "fan", "delay"],
      3: ["cross", "parallel", "radial", "fan", "delay", "cross"],
    };
    const type = phasePatterns[this.phase][this.attackIndex % phasePatterns[this.phase].length];
    this.attackIndex++;
    this.attack = { type, elapsed: 0, fired: false, shots: 0, nextShot: 0, activeUntil: 0, lines: [] };
    if (type === "cross") {
      this.attack.warningDuration = 0.45;
      this.attack.sweepDuration = this.phase === 3 ? 1.8 : 2.1;
      this.attack.sweepAngle = Math.PI * 35 / 180;
      this.attack.beamWidth = this.phase === 3 ? 12 : 10;
      this.attack.targetX = game.player.x;
      this.attack.targetY = game.player.y;
      this.attack.lines = this.crossLines(this.attack.targetX, this.attack.targetY, 0, 0, this.attack.beamWidth);
    }
    if (type === "fan") {
      this.attack.total = this.phase === 3 ? 32 : 28;
      this.attack.rounds = 2;
      this.attack.roundTargets = [];
    }
    if (type === "radial") this.attack.rounds = 3;
    if (type === "parallel") this.attack.beams = 11;
    game.addParticles(this.x, this.y + 18, this.phase === 3 ? "#ff596a" : "#65eaff", 8, 0.35);
  }

  updateAttack(dt, game) {
    const a = this.attack;
    a.elapsed += dt;

    if (a.type === "cross") {
      const sweepProgress = clamp((a.elapsed - a.warningDuration) / a.sweepDuration, 0, 1);
      const leftRotation = sweepProgress * a.sweepAngle;
      const rightRotation = -sweepProgress * a.sweepAngle;
      a.lines = this.crossLines(a.targetX, a.targetY, leftRotation, rightRotation, a.beamWidth);
      if (a.elapsed >= a.warningDuration) {
        if (!a.fired) {
          a.fired = true;
          game.screenShake = Math.max(game.screenShake, 0.16);
          for (const line of a.lines) game.addParticles(line.ax, line.ay, "#ff6359", 4, 0.2);
        }
        this.damageFromLines(a.lines, game);
      }
      if (sweepProgress >= 1) this.finishAttack();
      return;
    }

    if (a.type === "parallel") {
      if (!a.fired && a.elapsed >= 0.95) {
        a.fired = true;
        a.lines = this.parallelLines();
        a.activeUntil = a.elapsed + 0.52;
        game.addParticles(this.x, this.y + 48, "#67eaff", 12, 0.3);
      }
      if (a.activeUntil > a.elapsed) this.damageFromLines(a.lines, game);
      if (a.elapsed > 1.65) this.finishAttack();
      return;
    }

    if (a.type === "radial") {
      const firstRound = 0.3;
      const roundInterval = 0.48;
      const bulletCount = 30;
      while (a.shots < a.rounds && a.elapsed >= firstRound + a.shots * roundInterval) {
        const startAngle = -Math.PI / 2 + rand(-0.15, 0.15) + a.shots * Math.PI / bulletCount;
        for (let i = 0; i < bulletCount; i++) {
          const angle = startAngle + i * Math.PI * 2 / bulletCount;
          this.spawnBullet(game, this.x, this.y + 28, angle, 148, 5, "#65eaff", 4);
        }
        a.shots++;
      }
      if (a.shots >= a.rounds && a.elapsed > firstRound + (a.rounds - 1) * roundInterval + 0.5) this.finishAttack();
      return;
    }

    if (a.type === "fan") {
      const firstShot = 0.24;
      const shotInterval = 0.075;
      const roundGap = 0.38;
      const totalShots = a.total * a.rounds;
      while (a.shots < totalShots) {
        const round = Math.floor(a.shots / a.total);
        const shotInRound = a.shots % a.total;
        const scheduledAt = firstShot + round * (a.total * shotInterval + roundGap) + shotInRound * shotInterval;
        if (a.elapsed < scheduledAt) break;
        if (!a.roundTargets[round]) {
          a.roundTargets[round] = { x: game.player.x, y: game.player.y };
        }
        const target = a.roundTargets[round];
        const side = shotInRound % 2 === 0 ? -1 : 1;
        const index = Math.floor(shotInRound / 2);
        const countPerSide = a.total / 2;
        const spread = 0.88;
        const originX = this.x + side * 126;
        const originY = this.y + 34;
        const baseAngle = Math.atan2(target.y - originY, target.x - originX);
        const spreadOffset = side === -1
          ? -spread / 2 + (index / (countPerSide - 1)) * spread
          : spread / 2 - (index / (countPerSide - 1)) * spread;
        this.spawnBullet(game, originX, originY, baseAngle + spreadOffset, 164, 5, "#d9a5ff", 4);
        a.shots++;
      }
      const lastShotAt = firstShot + (a.rounds - 1) * (a.total * shotInterval + roundGap) + (a.total - 1) * shotInterval;
      if (a.shots >= totalShots && a.elapsed > lastShotAt + 0.35) this.finishAttack();
      return;
    }

    if (a.type === "delay") {
      if (!a.fired && a.elapsed >= 0.32) {
        a.fired = true;
        for (let i = -1; i <= 1; i += 2) {
          game.bossProjectiles.push({
            x: this.x + i * 105,
            y: this.y + 58,
            vx: i * 22,
            vy: 102,
            r: 11,
            color: "#ff9b66",
            startY: this.y + 58,
            explodeAfter: 300,
            dead: false,
          });
        }
      }
      if (a.elapsed > 0.95) this.finishAttack();
    }
  }

  finishAttack() {
    this.attack = null;
    const cooldownByPhase = {
      1: [1.2, 1.6],
      2: [0.9, 1.2],
      3: [0.6, 0.9],
    };
    const [minCooldown, maxCooldown] = cooldownByPhase[this.phase];
    this.attackCooldown = rand(minCooldown, maxCooldown);
  }

  crossLines(targetX, targetY, leftRotation = 0, rightRotation = 0, width = 10) {
    const visualScale = 0.66;
    const turretY = this.y + 26 * visualScale;
    const barrelLength = 62 * visualScale;
    const length = Math.hypot(W, H) * 1.35;
    const makeLine = (side, rotation) => {
      const turretX = this.x + side * 132 * visualScale;
      const angle = Math.atan2(targetY - turretY, targetX - turretX) + rotation;
      const ax = turretX + Math.cos(angle) * barrelLength;
      const ay = turretY + Math.sin(angle) * barrelLength;
      return {
        ax,
        ay,
        bx: ax + Math.cos(angle) * length,
        by: ay + Math.sin(angle) * length,
        width,
      };
    };
    return [makeLine(-1, leftRotation), makeLine(1, rightRotation)];
  }

  parallelLines() {
    const lines = [];
    const count = 11;
    const spacing = 54;
    for (let i = 0; i < count; i++) {
      const x = this.x + (i - (count - 1) / 2) * spacing;
      lines.push({ ax: x, ay: this.y + 64, bx: x, by: H + 30, width: 7 });
    }
    return lines;
  }

  damageFromLines(lines, game) {
    for (const line of lines) {
      if (distToSegment(game.player.x, game.player.y, line.ax, line.ay, line.bx, line.by) < line.width + game.player.r) {
        game.player.hit(18);
      }
    }
  }

  spawnBullet(game, x, y, angle, speed, damage, color, r) {
    const bullet = new Bullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, damage, color, r);
    bullet.bossShot = true;
    game.enemyBullets.push(bullet);
  }

  updateProjectiles(dt, game) {
    for (const projectile of game.bossProjectiles) {
      projectile.x += projectile.vx * dt;
      projectile.y += projectile.vy * dt;
      const hitPlayer = Math.hypot(projectile.x - game.player.x, projectile.y - game.player.y) <= projectile.r + game.player.r;
      const reachedDistance = projectile.y - projectile.startY >= projectile.explodeAfter || projectile.y > H + 20;
      if (hitPlayer || reachedDistance) {
        projectile.dead = true;
        if (hitPlayer) {
          game.player.hit(20);
          game.addParticles(projectile.x, projectile.y, projectile.color, 6, 0.7);
          game.screenShake = Math.max(game.screenShake, 0.22);
        }
        game.explosion(projectile.x, projectile.y, projectile.color, 0.65);
        const bulletCount = 25;
        for (let i = 0; i < bulletCount; i++) {
          const angle = i * Math.PI * 2 / bulletCount + this.time * 0.25;
          this.spawnBullet(game, projectile.x, projectile.y, angle, 126, 5, "#ffbc7c", 4);
        }
      }
    }
    game.bossProjectiles = game.bossProjectiles.filter(projectile => !projectile.dead);
  }

  hit(damage, game, x = this.x, y = this.y) {
    if (this.defeated) return false;
    this.hp = Math.max(0, this.hp - damage);
    this.hitFlash = 0.16;
    this.damagePulse = 1;
    game.addParticles(x, y, this.phase === 3 ? "#ff6774" : "#8fefff", 5, 0.45);
    if (this.hp <= 0) this.defeat(game);
    return this.hp <= 0;
  }

  defeat(game) {
    if (this.defeated) return;
    this.defeated = true;
    this.attack = null;
    game.enemyBullets = [];
    game.bossProjectiles = [];
    game.gold += 1000;
    if (game.mode === "boss") game.waveState = "bossVictory";
    game.explosion(this.x, this.y, "#ff5065", 2.2);
    game.screenShake = 0.7;
  }

  draw() {
    this.drawAttackVisuals();
    this.drawProjectiles();
    const alpha = this.defeated ? clamp(1 - this.deathTimer / 1.8, 0, 1) : 1;
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y);
    ctx.scale(0.66, 0.66);

    this.drawEngine(-92, -150, 34, this.phase === 3);
    this.drawEngine(92, -150, 34, this.phase === 3);
    this.drawWing(-1);
    this.drawWing(1);
    this.drawHull();
    const crossLines = this.attack?.type === "cross" ? this.attack.lines : null;
    const leftAim = crossLines?.[0]
      ? Math.atan2(crossLines[0].by - crossLines[0].ay, crossLines[0].bx - crossLines[0].ax) - Math.PI / 2
      : null;
    const rightAim = crossLines?.[1]
      ? Math.atan2(crossLines[1].by - crossLines[1].ay, crossLines[1].bx - crossLines[1].ax) - Math.PI / 2
      : null;
    this.drawTurret(-132, 26, -1, leftAim);
    this.drawTurret(132, 26, 1, rightAim);

    ctx.restore();
  }

  drawAttackVisuals() {
    if (!this.attack) return;
    const a = this.attack;
    if (a.type === "cross") {
      const active = a.elapsed >= a.warningDuration;
      for (const line of a.lines) this.drawBeam(line, active);
    } else if (a.type === "parallel") {
      const lines = a.lines.length ? a.lines : this.parallelLines();
      if (a.elapsed < 0.95 || a.activeUntil > a.elapsed) {
        for (const line of lines) this.drawBeam(line, a.activeUntil > a.elapsed);
      }
    }
  }

  drawBeam(line, active) {
    ctx.save();
    ctx.strokeStyle = active ? "rgba(255,85,79,0.9)" : "rgba(255,85,79,0.42)";
    ctx.shadowColor = active ? "#ff3e47" : "#ff6b60";
    ctx.shadowBlur = active ? 18 : 8;
    ctx.lineWidth = active ? line.width : 2;
    if (!active) ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(line.ax, line.ay);
    ctx.lineTo(line.bx, line.by);
    ctx.stroke();
    ctx.setLineDash([]);
    if (active) {
      ctx.strokeStyle = "#fff5e8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(line.ax, line.ay);
      ctx.lineTo(line.bx, line.by);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawProjectiles() {
    for (const projectile of game.bossProjectiles) {
      ctx.save();
      ctx.fillStyle = projectile.color;
      ctx.shadowColor = projectile.color;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, projectile.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff4dd";
      ctx.beginPath();
      ctx.arc(projectile.x - 3, projectile.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawWing(side) {
    ctx.save();
    ctx.scale(side, 1);
    const path = new Path2D();
    path.moveTo(20, -112); path.lineTo(128, -139); path.lineTo(210, -126); path.lineTo(284, -86);
    path.lineTo(412, -68); path.lineTo(470, -25); path.lineTo(436, 48); path.lineTo(337, 68);
    path.lineTo(280, 116); path.lineTo(154, 98); path.lineTo(92, 57); path.lineTo(20, 45); path.closePath();
    const fill = ctx.createLinearGradient(0, -140, 420, 120);
    fill.addColorStop(0, "#2d4350"); fill.addColorStop(0.42, "#172732"); fill.addColorStop(1, "#0b151d");
    ctx.fillStyle = this.hitFlash > 0 ? "#d8faff" : fill;
    ctx.strokeStyle = this.phase === 3 ? "#8c3d49" : "#4b6b78";
    ctx.lineWidth = 3;
    ctx.fill(path); ctx.stroke(path);
    ctx.fillStyle = this.phase === 3 ? "rgba(255,65,87,0.72)" : "rgba(83,232,255,0.62)";
    ctx.shadowColor = this.phase === 3 ? "#ff4358" : "#53e8ff";
    ctx.shadowBlur = 13;
    ctx.beginPath(); ctx.moveTo(132, -72); ctx.lineTo(221, -77); ctx.lineTo(257, -58); ctx.lineTo(226, -48); ctx.lineTo(144, -50); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(121,154,168,0.55)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(302, -57); ctx.lineTo(400, -36); ctx.lineTo(372, 24); ctx.lineTo(302, 38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(284, 64); ctx.lineTo(333, 45); ctx.lineTo(401, 31); ctx.stroke();
    if (this.phase === 3 && side === 1) {
      ctx.strokeStyle = "#ff675e"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(331, -47); ctx.lineTo(350, -29); ctx.lineTo(340, -12); ctx.lineTo(366, 2); ctx.stroke();
    }
    ctx.restore();
  }

  drawHull() {
    const body = new Path2D();
    body.moveTo(0, -184); body.bezierCurveTo(69, -173, 126, -119, 136, -42); body.lineTo(110, 93);
    body.lineTo(52, 158); body.lineTo(0, 181); body.lineTo(-52, 158); body.lineTo(-110, 93);
    body.lineTo(-136, -42); body.bezierCurveTo(-126, -119, -69, -173, 0, -184); body.closePath();
    const fill = ctx.createLinearGradient(-120, -180, 120, 180);
    fill.addColorStop(0, "#526875"); fill.addColorStop(0.3, "#213541"); fill.addColorStop(0.66, "#0a151d"); fill.addColorStop(1, "#2a414b");
    ctx.fillStyle = this.hitFlash > 0 ? "#e8fcff" : fill;
    ctx.strokeStyle = this.phase === 3 ? "#a54b55" : "#5e7b87"; ctx.lineWidth = 3;
    ctx.fill(body); ctx.stroke(body);
    ctx.fillStyle = "#080f15"; ctx.strokeStyle = "#38525d"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -147); ctx.lineTo(72, -98); ctx.lineTo(87, 49); ctx.lineTo(44, 127); ctx.lineTo(0, 149); ctx.lineTo(-44, 127); ctx.lineTo(-87, 49); ctx.lineTo(-72, -98); ctx.closePath(); ctx.fill(); ctx.stroke();

    const coreColor = this.phase === 3 ? "#ff4f62" : "#5ceeff";
    const pulse = 0.9 + Math.sin(this.time * (this.phase === 3 ? 7 : 3.5)) * 0.1;
    ctx.save(); ctx.translate(0, 33);
    ctx.strokeStyle = this.phase === 3 ? "rgba(255,80,98,0.8)" : "rgba(91,234,255,0.56)"; ctx.lineWidth = 4; ctx.setLineDash([12, 12]);
    ctx.beginPath(); ctx.arc(0, 0, 65, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    const halo = ctx.createRadialGradient(0, 0, 4, 0, 0, 74); halo.addColorStop(0, "#ffffff"); halo.addColorStop(0.2, coreColor); halo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, 74 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#071017"; ctx.strokeStyle = coreColor; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, this.phase === 3 ? 34 : 28, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = coreColor; ctx.shadowColor = coreColor; ctx.shadowBlur = 26; ctx.beginPath(); ctx.arc(0, 0, (this.phase === 3 ? 18 : 13) * pulse, 0, Math.PI * 2); ctx.fill(); ctx.restore();

    if (this.phase === 3) {
      ctx.strokeStyle = "#ff655c"; ctx.shadowColor = "#ff2f3f"; ctx.shadowBlur = 8; ctx.lineWidth = 2.2;
      for (const points of [[-72, -76, -43, -48, -65, -18, -34, 7], [76, 82, 50, 103, 62, 128, 27, 147], [91, -12, 67, 1, 83, 23, 56, 41]]) {
        ctx.beginPath(); ctx.moveTo(points[0], points[1]);
        for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
        ctx.stroke();
      }
    }
  }

  drawTurret(x, y, side, aimAngle = null) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(aimAngle ?? Math.sin(this.time * 0.7 + side) * 0.18);
    ctx.fillStyle = "#0a141b"; ctx.strokeStyle = "#718b96"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const fill = ctx.createLinearGradient(-25, -25, 25, 30); fill.addColorStop(0, "#596f7a"); fill.addColorStop(0.5, "#1c2d36"); fill.addColorStop(1, "#0b151d");
    ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(-27, -16); ctx.lineTo(0, -31); ctx.lineTo(27, -16); ctx.lineTo(24, 21); ctx.lineTo(-24, 21); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = this.phase === 3 ? "#ff5968" : "#5ceaff"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-13, 3); ctx.lineTo(-13, 62); ctx.moveTo(13, 3); ctx.lineTo(13, 62); ctx.stroke();
    ctx.strokeStyle = "#172631"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-13, 5); ctx.lineTo(-13, 61); ctx.moveTo(13, 5); ctx.lineTo(13, 61); ctx.stroke();
    ctx.fillStyle = this.phase === 3 ? "#ff5968" : "#74efff"; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(0, -4, 8, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  drawEngine(x, y, size, damaged) {
    ctx.save(); ctx.translate(x, y);
    const color = damaged ? "#ff4f5d" : "#50e1ff";
    const gradient = ctx.createLinearGradient(0, 0, 0, -size * 2.2); gradient.addColorStop(0, color); gradient.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gradient; ctx.beginPath(); ctx.moveTo(-size * 0.62, 0); ctx.quadraticCurveTo(-size * 0.28, -size * 1.1, 0, -size * 2.2); ctx.quadraticCurveTo(size * 0.28, -size * 1.1, size * 0.62, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#eaffff"; ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.beginPath(); ctx.ellipse(0, 0, size * 0.58, size * 0.24, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

// ---------- 玩家 ----------
class Player {
  constructor() {
    this.x = W / 2;
    this.y = H - 80;
    this.r = 10;
    this.speed = 300;
    this.maxHp = 100;
    this.hp = 100;
    this.invuln = 0;        // 受伤后无敌时间
    this.fireTimer = 0;
    this.fireInterval = 0.14;
    this.bulletDamage = 1;
    this.laserCharges = 0;    // 当前激光次数
    this.maxLaserCharges = 5; // 单局永久激光上限，死亡后恢复
    this.bombCapacity = 1;    // 每次选择炸弹时获得的数量
    this.trackShotsPerSecond = 2; // 每次选择追踪道具后的基础射速
    this.shield = 0;       // 护盾值（本回合道具，优先抵挡伤害）
  }

  update(dt, input, game) {
    // 移动
    let dx = 0, dy = 0;
    if (input.left) dx -= 1;
    if (input.right) dx += 1;
    if (input.up) dy -= 1;
    if (input.down) dy += 1;
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    this.x = clamp(this.x + dx * this.speed * dt, this.r + 8, W - this.r - 8);
    this.y = clamp(this.y + dy * this.speed * dt, this.r + 8, H - this.r - 8);
    this.invuln = Math.max(0, this.invuln - dt);

    // 全自动射击
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fireTimer = this.fireInterval;
      game.bullets.push(new Bullet(this.x, this.y - this.r - 4, 0, -720, this.bulletDamage, "#7ef0ff"));
      game.muzzle = 0.08; // 枪口闪光
    }
  }

  hit(damage) {
    if (this.invuln > 0) return;
    let d = damage;
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, d);
      this.shield -= absorbed;
      d -= absorbed;
    }
    if (d > 0) {
      this.hp -= d;
      this.invuln = 1.2;
    } else {
      this.invuln = 0.3; // 护盾完全抵挡时短暂无敌，防止被同帧连击
    }
  }

  draw() {
    // 无敌闪烁
    if (this.invuln > 0 && Math.floor(this.invuln * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    // 护盾：蓝色发光圈
    if (this.shield > 0) {
      const pulse = 1 + 0.06 * Math.sin(game.time * 6);
      const sr = (this.r + 9) * pulse;
      ctx.beginPath();
      ctx.arc(0, 0, sr, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(80,190,255,0.12)";
      ctx.fill();
      ctx.strokeStyle = "rgba(110,210,255,0.95)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#4dd0ff";
      ctx.shadowBlur = 16;
      ctx.stroke();
      ctx.shadowBlur = 0;
      // 内圈细线
      ctx.beginPath();
      ctx.arc(0, 0, sr * 0.82, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(110,210,255,0.4)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = "#4dd0ff";
    ctx.shadowColor = "#4dd0ff";
    ctx.shadowBlur = 16;
    // 飞船主体（三角形）
    ctx.beginPath();
    ctx.moveTo(0, -this.r - 6);
    ctx.lineTo(this.r, this.r);
    ctx.lineTo(0, this.r * 0.5);
    ctx.lineTo(-this.r, this.r);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // 引擎火焰
    ctx.fillStyle = game.muzzle > 0 ? "#fff" : "#ffd43b";
    ctx.beginPath();
    ctx.moveTo(-6, this.r * 0.5);
    ctx.lineTo(6, this.r * 0.5);
    ctx.lineTo(0, this.r * 0.5 + 10 + Math.random() * 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// 场上同时存在的敌人上限（防止无限刷怪堆叠）
const MAX_ALIVE_ENEMIES = 10;
const SHOP_INTERVAL = 5;
const SHOP_PRICE = 2000;

// ---------- 主游戏对象 ----------
class Game {
  constructor() {
    this.reset();
  }

  reset() {
    this.player = new Player();
    this.mode = "select";        // select | campaign | boss
    this.boss = null;
    this.bossProjectiles = [];
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.playerLasers = []; // 玩家发射的激光
    this.particles = [];
    this.shockwaves = [];  // 爆炸冲击波圆环
    this.floatTexts = [];
    this.gold = 0;
    this.wave = 0;
    this.waveState = "modeSelect"; // modeSelect | intermission | fighting | bossWarmup | reward | shop | item | bossIntro | boss | bossVictory | gameover
    this.paused = false;
    this.intermissionTimer = 1.6;
    this.waveKills = 0; // 本波已击杀数
    this.waveQuota = 0; // 本波所需击杀数（刷够即停止刷怪）
    this.spawnTimer = 0;
    this.bossWarmupTotal = 0;
    this.bossWarmupSpawned = 0;
    this.rewardOptions = null; // 增益选择卡片
    this.rewardHover = -1;
    this.choiceAnimation = null;
    this.mouseX = -1; this.mouseY = -1;
    this.item = null;          // 本回合道具（护盾/炸弹/自动追踪）
    this.itemOptions = null;   // 道具选择卡片
    this.shopOptions = null;   // 每 5 波开放的永久强化商店
    this.shopNotice = "";
    this.shopNoticeTimer = 0;
    this.bomb = null;          // 飞行中的炸弹
    this.homingBullets = [];   // 自动追踪子弹
    this.trackTimer = 0;
    this.time = 0;
    this.muzzle = 0;
    this.screenShake = 0;
    this.stars = [];
    for (let i = 0; i < 90; i++) {
      this.stars.push({ x: rand(0, W), y: rand(0, H), s: rand(0.5, 2.2), v: rand(20, 90) });
    }
  }

  modeOptions() {
    return [
      { id: "campaign", key: "1", name: "普通战役", x: W / 2 - 220, y: H / 2 - 30, w: 200, h: 118 },
      { id: "boss", key: "2", name: "BOSS战", x: W / 2 + 20, y: H / 2 - 30, w: 200, h: 118 },
    ];
  }

  modeAt(mx, my) {
    if (this.waveState !== "modeSelect") return null;
    return this.modeOptions().find(option => mx >= option.x && mx <= option.x + option.w && my >= option.y && my <= option.y + option.h) || null;
  }

  selectMode(mode) {
    if (this.waveState !== "modeSelect") return false;
    this.mode = mode;
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.bossProjectiles = [];
    this.playerLasers = [];
    this.homingBullets = [];
    this.bomb = null;
    this.player.x = W / 2;
    this.player.y = H - 80;
    if (mode === "boss") {
      this.boss = new Boss();
      this.waveState = "bossIntro";
      this.player.laserCharges = this.player.maxLaserCharges;
      this.player.invuln = 0;
    } else {
      this.waveState = "intermission";
      this.intermissionTimer = 1.6;
    }
    return true;
  }

  // 本波所需击杀数（配额）
  waveQuotaFor(n) { return 7 + n * 3; }

  isBossWave(n = this.wave) { return n > 0 && n % 10 === 0; }

  isCampaignBossState() {
    return this.mode === "campaign" && ["bossWarmup", "bossIntro", "boss"].includes(this.waveState);
  }

  // 随机生成一只敌人（波次越高越强、越容易出现高级敌人）
  randomEnemyItem() {
    const n = this.wave;
    const roll = Math.random();
    let type;
    if (n < 4) {
      // 前 3 波以最简单的侦察机为主
      if (n >= 3 && roll < 0.05) type = "tank";
      else if (n >= 3 && roll < 0.1) type = "spinner";
      else if (roll < 0.3) type = "grunt";
      else type = "scout";
    } else if (n === 4) {
      // 第 4 波：装甲机和环射机各占原高级敌机概率的一半。
      if (roll < 0.19) type = "tank";
      else if (roll < 0.38) type = "spinner";
      else if (roll < 0.7) type = "grunt";
      else type = "scout";
    } else {
      // 精英机从第 5 波的 12% 起，每波增加 4%，第 12 波达到 40% 上限。
      const eliteChance = Math.min(0.4, 0.12 + (n - 5) * 0.04);
      if (roll < eliteChance) {
        type = "elite";
      } else {
        // 剩余概率按原有比例分配，装甲机与环射机始终保持相同刷新率。
        const nonEliteRoll = (roll - eliteChance) / (1 - eliteChance);
        if (nonEliteRoll < 13 / 88) type = "tank";
        else if (nonEliteRoll < 26 / 88) type = "spinner";
        else if (nonEliteRoll < 58 / 88) type = "grunt";
        else type = "scout";
      }
    }
    // 波次越高，敌人血量越多
    return { type, hpMul: 1 + n * 0.15 };
  }

  spawnEnemy(item) {
    const type = ENEMY_TYPES[item.type];
    const e = new Enemy(item.type, rand(40, W - 40), -type.r - 10);
    // 精英机血量固定 40，不随波次放大；其余敌人随波次增强
    const mul = item.type === "elite" ? 1 : item.hpMul;
    e.maxHp = Math.round(e.maxHp * mul);
    e.hp = e.maxHp;
    return e;
  }

  // BOSS 预热使用独立概率表，不改动普通战役各波次的刷新规则。
  randomBossWarmupItem() {
    const roll = Math.random();
    let type;
    if (roll < 0.16) type = "tank";
    else if (roll < 0.32) type = "spinner";
    else if (roll < 0.44) type = "elite";
    else if (roll < 0.72) type = "grunt";
    else type = "scout";
    return { type, hpMul: 1 + this.wave * 0.15 };
  }

  startCampaignBossWave() {
    this.boss = null;
    this.bossProjectiles = [];
    this.enemyBullets = [];
    this.playerLasers = [];
    this.homingBullets = [];
    this.bomb = null;
    this.waveKills = 0;
    this.waveQuota = 0;
    this.bossWarmupTotal = randInt(15, 30);
    this.bossWarmupSpawned = 0;
    this.spawnTimer = 0.25;
    this.waveState = "bossWarmup";
  }

  startCampaignBossIntro() {
    if (this.waveState !== "bossWarmup" || this.enemies.length > 0) return;
    this.boss = new Boss();
    this.bossProjectiles = [];
    this.enemyBullets = [];
    this.playerLasers = [];
    this.homingBullets = [];
    this.bomb = null;
    this.waveState = "bossIntro";
    this.player.invuln = Math.max(this.player.invuln, 0.4);
  }

  completeCampaignBoss() {
    if (this.mode !== "campaign" || !this.boss?.defeated) return;
    this.boss = null;
    this.bossProjectiles = [];
    this.enemyBullets = [];
    this.playerLasers = [];
    this.homingBullets = [];
    this.bomb = null;
    this.player.hp = this.player.maxHp;
    this.player.invuln = 0.5;
    this.item = null;
    this.player.shield = 0;
    this.trackTimer = 0;
    this.rewardOptions = [
      { id: "hp",    name: "生命 +5",  icon: "♥" },
      { id: "speed", name: "攻速 +5%", icon: "⚡" },
      { id: "laser", name: "激光补满", icon: "◉" },
    ];
    this.rewardHover = -1;
    this.waveState = "reward";
  }

  spawnEnemyBullet(x, y, player) {
    // 朝玩家方向射击（敌人子弹稍慢、更大）
    const dx = player.x - x;
    const dy = player.y - y;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 140;
    return new Bullet(x, y, (dx / len) * speed, (dy / len) * speed, 5, "#ff5e7a", 5);
  }

  addParticles(x, y, color, count, power = 1) {
    for (let i = 0; i < count; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp = rand(40, 260) * power;
      this.particles.push(new Particle(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp, rand(0.3, 0.9), rand(1.5, 4), color));
    }
  }

  update(dt, input) {
    if (this.paused) return;
    this.time += dt;
    this.muzzle = Math.max(0, this.muzzle - dt);
    this.screenShake = Math.max(0, this.screenShake - dt);
    this.shopNoticeTimer = Math.max(0, this.shopNoticeTimer - dt);

    // 星星滚动
    for (const s of this.stars) {
      s.y += s.v * dt;
      if (s.y > H) { s.y = -2; s.x = rand(0, W); }
    }

    if (this.waveState === "modeSelect") return;

    // 选择动画结束后才应用效果，避免界面状态提前切走。
    if (this.choiceAnimation) {
      this.choiceAnimation.elapsed += dt;
      if (this.choiceAnimation.elapsed >= this.choiceAnimation.duration) {
        const selection = this.choiceAnimation;
        this.choiceAnimation = null;
        if (selection.kind === "reward" && this.waveState === "reward") this.applyReward(selection.id);
        else if (selection.kind === "item" && this.waveState === "item") this.applyItem(selection.id);
        else if (selection.kind === "shop" && this.waveState === "shop") this.applyShopPurchase(selection.id);
      }
      return;
    }

    if (this.waveState === "gameover" || this.waveState === "reward" || this.waveState === "shop" || this.waveState === "item") return;

    if (this.waveState !== "bossVictory") this.player.update(dt, input, this);

    const bossActive = !!this.boss && (this.waveState === "bossIntro" || this.waveState === "boss");
    if (bossActive && this.boss) {
      this.boss.update(dt, this);
      if (this.mode === "campaign" && this.waveState === "boss" && this.boss.defeated && this.boss.deathTimer >= 1.8) {
        this.completeCampaignBoss();
      }
      if (this.boss && !this.boss.entering && !this.boss.defeated && this.boss.collidesCircle(this.player.x, this.player.y, this.player.r)) {
        this.player.hp = 0;
        this.gameOver();
        return;
      }
      if (this.player.hp <= 0) {
        this.gameOver();
        return;
      }
    }

    // ---- 波次流程：持续刷怪，直到玩家刷够本波配额 ----
    if (this.mode === "campaign" && this.waveState === "intermission") {
      this.intermissionTimer -= dt;
      if (this.intermissionTimer <= 0) {
        this.wave++;
        this.waveKills = 0;
        if (this.isBossWave()) {
          this.startCampaignBossWave();
        } else {
          this.waveQuota = this.waveQuotaFor(this.wave);
          this.spawnTimer = 0.3;
          this.waveState = "fighting";
        }
      }
    } else if (this.mode === "campaign" && this.waveState === "bossWarmup") {
      this.spawnTimer -= dt;
      if (this.bossWarmupSpawned < this.bossWarmupTotal && this.spawnTimer <= 0 && this.enemies.length < MAX_ALIVE_ENEMIES) {
        this.enemies.push(this.spawnEnemy(this.randomBossWarmupItem()));
        this.bossWarmupSpawned++;
        this.spawnTimer = rand(0.25, 0.5);
      }
      if (this.bossWarmupSpawned >= this.bossWarmupTotal && this.enemies.length === 0) {
        this.startCampaignBossIntro();
      }
    } else if (this.mode === "campaign" && this.waveState === "fighting") {
      // 击杀数未达标且场上敌人未满时，持续刷怪
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0 && this.enemies.length < MAX_ALIVE_ENEMIES) {
        this.enemies.push(this.spawnEnemy(this.randomEnemyItem()));
        this.spawnTimer = rand(0.3, 0.55);
      }
    }

    // ---- 子弹 ----
    for (const b of this.bullets) { b.px = b.x; b.py = b.y; b.update(dt); }
    for (const b of this.enemyBullets) { b.px = b.x; b.py = b.y; b.update(dt); }
    this.bullets = this.bullets.filter(b => !b.dead);
    this.enemyBullets = this.enemyBullets.filter(b => !b.dead);

    // ---- 碰撞：玩家子弹 vs 敌人（扫掠式检测，防止高速子弹穿透） ----
    for (const b of this.bullets) {
      for (const e of this.enemies) {
        // 本帧子弹走过的线段 (px,py)->(x,y) 与敌人圆是否相交
        const dx = b.x - b.px, dy = b.y - b.py;
        const ex = e.x - b.px, ey = e.y - b.py;
        const len2 = dx * dx + dy * dy;
        let t = len2 > 0 ? (ex * dx + ey * dy) / len2 : 0;
        t = clamp(t, 0, 1);
        const cx = b.px + dx * t, cy = b.py + dy * t;
        const ddx = e.x - cx, ddy = e.y - cy;
        const rr = e.r + b.r;
        if (ddx * ddx + ddy * ddy < rr * rr) {
          b.dead = true;
          const killed = e.hit(b.damage);
          this.addParticles(b.x, b.y, b.color, 4, 0.6);
          if (killed) this.killEnemy(e);
          break;
        }
      }
      if (!b.dead && bossActive && this.boss && !this.boss.entering && !this.boss.defeated) {
        const impact = this.boss.segmentImpact(b.px, b.py, b.x, b.y, b.r);
        if (impact) {
          b.dead = true;
          this.boss.hit(b.damage, this, impact.x, impact.y);
          this.addParticles(impact.x, impact.y, b.color, 4, 0.6);
        }
      }
    }
    this.bullets = this.bullets.filter(b => !b.dead);

    // ---- 碰撞：敌人子弹 vs 玩家 ----
    for (const b of this.enemyBullets) {
      const dx = b.x - this.player.x, dy = b.y - this.player.y;
      if (dx * dx + dy * dy < (this.player.r + b.r) * (this.player.r + b.r)) {
        b.dead = true;
        this.player.hit(b.damage);
        this.addParticles(b.x, b.y, "#ff5e7a", 6, 0.7);
        if (this.player.hp <= 0) { this.gameOver(); break; }
      }
    }
    this.enemyBullets = this.enemyBullets.filter(b => !b.dead);

    // ---- 碰撞：敌人撞到玩家 ----
    if (this.waveState !== "gameover") {
      for (const e of this.enemies) {
        const dx = e.x - this.player.x, dy = e.y - this.player.y;
        if (dx * dx + dy * dy < (e.r + this.player.r) * (e.r + this.player.r)) {
          this.player.hit(20);
          this.killEnemy(e); // 撞击后敌人也爆掉
          this.screenShake = 0.3;
          if (this.player.hp <= 0) { this.gameOver(); break; }
        }
      }
    }

    // ---- 玩家激光（穿透光束，持续 0.35 秒） ----
    for (const l of this.playerLasers) l.t -= dt;
    this.playerLasers = this.playerLasers.filter(l => l.t > 0);
    for (const l of this.playerLasers) {
      for (const e of [...this.enemies]) {
        if (l.hit.has(e)) continue;
        if (Math.abs(e.x - l.x) < PLAYER_LASER_HIT_RADIUS + e.r) {
          l.hit.add(e);
          const killed = e.hit(l.damage);
          this.addParticles(e.x, e.y, "#7ef0ff", 6, 0.8);
          if (killed) this.killEnemy(e);
        }
      }
    }

    // ---- 自动追踪道具：基础 2 发/秒，商店强化可永久叠加 ----
    const bossTargetAvailable = bossActive && this.boss && !this.boss.entering && !this.boss.defeated;
    if (this.item && this.item.id === "track" && (this.enemies.length > 0 || bossTargetAvailable)) {
      this.trackTimer -= dt;
      if (this.trackTimer <= 0) {
        this.trackTimer = 1 / this.player.trackShotsPerSecond;
        const x = this.player.x;
        const y = this.player.y - this.player.r - 6;
        let target = bossTargetAvailable ? this.boss : null;
        let targetDistance = bossTargetAvailable ? (this.boss.x - x) ** 2 + (this.boss.y - y) ** 2 : Infinity;
        for (const e of this.enemies) {
          const distance = (e.x - x) ** 2 + (e.y - y) ** 2;
          if (distance < targetDistance) {
            targetDistance = distance;
            target = e;
          }
        }
        this.homingBullets.push({
          x, y, speed: 380, damage: 1, dead: false, target,
          vx: 0, vy: -380,
        });
      }
    }
    for (const hb of this.homingBullets) {
      const targetIsBoss = hb.target && hb.target === this.boss;
      const targetActive = hb.target && !hb.target.gone && (this.enemies.includes(hb.target) || (targetIsBoss && !this.boss.defeated));
      if (targetActive) {
        const previousX = hb.x;
        const previousY = hb.y;
        const dx = hb.target.x - hb.x, dy = hb.target.y - hb.y;
        const len = Math.hypot(dx, dy) || 1;
        hb.vx = (dx / len) * hb.speed;
        hb.vy = (dy / len) * hb.speed;
        hb.x += hb.vx * dt;
        hb.y += hb.vy * dt;
        const bossImpact = targetIsBoss ? this.boss.segmentImpact(previousX, previousY, hb.x, hb.y, 5) : null;
        const hitTarget = targetIsBoss
          ? bossImpact
          : Math.hypot(hb.target.x - hb.x, hb.target.y - hb.y) < hb.target.r + 5;
        if (hitTarget) {
          hb.dead = true;
          const impactX = bossImpact?.x ?? hb.x;
          const impactY = bossImpact?.y ?? hb.y;
          const killed = targetIsBoss ? hb.target.hit(hb.damage, this, impactX, impactY) : hb.target.hit(hb.damage);
          this.addParticles(impactX, impactY, "#ffe066", 5, 0.6);
          if (killed && !targetIsBoss) this.killEnemy(hb.target);
        }
      } else {
        // 锁定目标失效后保留最后速度，不再搜索或切换到其他目标。
        hb.target = null;
        hb.x += hb.vx * dt;
        hb.y += hb.vy * dt;
      }
      if (hb.x < -20 || hb.x > W + 20 || hb.y < -20 || hb.y > H + 20) hb.dead = true;
    }
    this.homingBullets = this.homingBullets.filter(hb => !hb.dead);

    // ---- 炸弹道具：直线飞行，接触敌人或抵达顶部时爆炸（35 范围伤害） ----
    if (this.bomb) {
      const previousY = this.bomb.y;
      this.bomb.y += this.bomb.vy * dt;
      let collided = false;
      for (const e of this.enemies) {
        if (distToSegment(e.x, e.y, this.bomb.x, previousY, this.bomb.x, this.bomb.y) <= this.bomb.r + e.r) {
          collided = true;
          break;
        }
      }
      if (!collided && bossActive && this.boss && !this.boss.entering && !this.boss.defeated) {
        collided = distToSegment(this.boss.x, this.boss.y, this.bomb.x, previousY, this.bomb.x, this.bomb.y) <= this.bomb.r + this.boss.hitRadius;
      }
      const reachedTop = this.bomb.y <= this.bomb.r;
      if (collided || reachedTop) {
        const bx = this.bomb.x, by = Math.max(this.bomb.y, this.bomb.r);
        this.bomb = null;
        this.explosion(bx, by, "#ffd43b", 1.4);
        playBombSound();
        this.floatTexts.push(new FloatText(bx, by - 26, "轰!", "#ffd43b", 24));
        const R = 95;
        for (const e of [...this.enemies]) {
          if (Math.hypot(e.x - bx, e.y - by) < R + e.r) {
            const killed = e.hit(35);
            if (killed) this.killEnemy(e);
          }
        }
        if (bossActive && this.boss && !this.boss.entering && !this.boss.defeated && Math.hypot(this.boss.x - bx, this.boss.y - by) < R + this.boss.hitRadius) {
          this.boss.hit(35, this, bx, by);
        }
      }
    }

    if (bossActive && this.boss && !this.boss.entering && !this.boss.defeated) {
      for (const l of this.playerLasers) {
        if (l.bossHit) continue;
        const impact = this.boss.segmentImpact(l.x, this.player.y, l.x, -10, PLAYER_LASER_HIT_RADIUS);
        if (!impact) continue;
        l.bossHit = true;
        this.boss.hit(l.damage, this, impact.x, impact.y);
        this.addParticles(impact.x, impact.y, "#7ef0ff", 10, 0.8);
      }
    }

    // ---- 敌人更新 ----
    if (!bossActive) {
      for (const e of this.enemies) e.update(dt, this);
      this.enemies = this.enemies.filter(e => !e.gone); // 侦察机飞出屏幕后移除
    }

    // ---- 粒子 & 文字 ----
    for (const p of this.particles) p.update(dt);
    for (const t of this.floatTexts) t.update(dt);
    for (const s of this.shockwaves) { s.life -= dt; s.r += s.speed * dt; }
    this.particles = this.particles.filter(p => p.life > 0);
    this.floatTexts = this.floatTexts.filter(t => t.life > 0);
    this.shockwaves = this.shockwaves.filter(s => s.life > 0);
  }

  killEnemy(e, countForWave = true) {
    const idx = this.enemies.indexOf(e);
    if (idx === -1) return;
    this.enemies.splice(idx, 1);
    this.gold += e.gold;
    if (countForWave && this.waveState === "fighting") this.waveKills++;
    if (countForWave) playKillSound();
    this.addParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 22, 1.4);
    this.addParticles(e.x, e.y, "#ffffff", 8, 1);
    this.shockwaves.push({ x: e.x, y: e.y, r: 5, speed: 240, life: 0.3, maxLife: 0.3, color: ENEMY_TYPES[e.type].color, width: 3 });
    this.screenShake = 0.18;
    this.floatTexts.push(new FloatText(e.x, e.y, "+" + e.gold, "#ffd43b", 13));
    // 刷够本波配额：停止刷怪，场上剩余敌人全部爆炸清场
    if (this.waveState === "fighting" && this.waveKills >= this.waveQuota) {
      this.clearWave();
    }
  }

  // 本波完成：场上剩余敌机全部爆炸销毁，清掉敌弹，进入下一波
  clearWave() {
    this.waveState = "intermission";
    this.intermissionTimer = 2;
    for (const e of [...this.enemies]) this.killEnemy(e, false);
    this.enemyBullets = [];
    this.floatTexts.push(new FloatText(W / 2, H / 2, "第 " + this.wave + " 波清场!", "#ffd43b", 26));
    // 每波结束重置玩家生命值
    this.player.hp = this.player.maxHp;
    this.player.invuln = 0.5; // 短暂无敌缓冲
    this.floatTexts.push(new FloatText(this.player.x, this.player.y - 30, "生命恢复!", "#51cf66", 16));
    // 本回合道具不保留到下一波（下一波重新选择）
    this.item = null;
    this.player.shield = 0;
    this.bomb = null;
    this.homingBullets = [];
    this.trackTimer = 0;
    // 从第 2 波起：每波成功后进入增益选择（肉鸽爬塔）
    if (this.wave >= 2) {
      this.waveState = "reward";
      this.rewardOptions = [
        { id: "hp",    name: "生命 +5",  icon: "♥" },
        { id: "speed", name: "攻速 +5%", icon: "⚡" },
        { id: "laser", name: "激光补满",  icon: "◉" },
      ];
      this.rewardHover = -1;
    }
  }

  openItemSelection() {
    this.waveState = "item";
    this.itemOptions = [
      { id: "shield", name: "护盾",     icon: "◈" },
      { id: "bomb",   name: "炸弹",     icon: "●" },
      { id: "track",  name: "自动追踪", icon: "◎" },
    ];
    this.rewardHover = -1;
  }

  openShop() {
    this.waveState = "shop";
    this.shopOptions = [
      { id: "laserCapacity", name: "激光充能", price: SHOP_PRICE, iconType: "laser" },
      { id: "bombCapacity",  name: "炸弹补给", price: SHOP_PRICE, iconType: "bomb" },
      { id: "trackRate",     name: "追踪火炮", price: SHOP_PRICE, iconType: "track" },
    ];
    this.shopNotice = "";
    this.shopNoticeTimer = 0;
    this.rewardHover = -1;
  }

  // 选择增益（1/2/3 键或鼠标点击）
  applyReward(id) {
    const p = this.player;
    if (id === "hp") {
      p.maxHp += 5;
      p.hp = Math.min(p.hp + 5, p.maxHp);
    } else if (id === "speed") {
      p.fireInterval = Math.max(0.05, p.fireInterval * 0.95);
    } else if (id === "laser") {
      p.laserCharges = p.maxLaserCharges;
    }
    this.waveState = "intermission";
    this.intermissionTimer = 1.5;
    this.rewardOptions = null;
    if (this.wave % SHOP_INTERVAL === 0) this.openShop();
    // 从第 3 波起：开战前再选择本回合一次性道具
    else if (this.wave + 1 >= 3) this.openItemSelection();
  }

  applyShopPurchase(id) {
    const option = this.shopOptions && this.shopOptions.find(item => item.id === id);
    if (!option || this.gold < option.price) return false;
    this.gold -= option.price;
    if (id === "laserCapacity") this.player.maxLaserCharges++;
    else if (id === "bombCapacity") this.player.bombCapacity++;
    else if (id === "trackRate") this.player.trackShotsPerSecond++;
    this.shopOptions = null;
    this.shopNotice = "";
    this.openItemSelection();
    return true;
  }

  leaveShop() {
    if (this.waveState !== "shop" || this.choiceAnimation) return false;
    this.shopOptions = null;
    this.shopNotice = "";
    this.openItemSelection();
    return true;
  }

  // 选择本回合道具（1/2/3 键或鼠标点击）
  applyItem(id) {
    if (id === "shield") {
      this.player.shield = 10;
      this.item = { id: "shield" };
    } else if (id === "bomb") {
      this.item = { id: "bomb", count: this.player.bombCapacity };
    } else if (id === "track") {
      this.item = { id: "track" };
      this.trackTimer = 0;
    }
    this.waveState = "intermission";
    this.intermissionTimer = 1.5;
    this.itemOptions = null;
  }

  // 发射炸弹（X 键，仅本回合有炸弹道具时可用）
  launchBomb() {
    if (this.waveState !== "fighting" && this.waveState !== "bossIntro" && this.waveState !== "boss") return false;
    if (!this.item || this.item.id !== "bomb" || this.item.count <= 0) return false;
    this.item.count--;
    // 直线向上飞行，接触敌人或抵达屏幕顶部时爆炸
    this.bomb = { x: this.player.x, y: this.player.y - 20, vy: -430, r: 7 };
    return true;
  }

  // 华丽爆炸特效：冲击波圆环 + 核心闪光 + 热火花 + 烟雾
  explosion(x, y, color = "#ffd43b", scale = 1) {
    this.shockwaves.push({ x, y, r: 8, speed: 540 * scale, life: 0.35, maxLife: 0.35, color: "#fff6d0", width: 6 });
    this.shockwaves.push({ x, y, r: 4, speed: 300 * scale, life: 0.55, maxLife: 0.55, color, width: 3 });
    // 核心闪光
    this.particles.push(new Particle(x, y, 0, 0, 0.22, 36 * scale, "#ffffff"));
    // 热火花
    for (let i = 0; i < 24 * scale; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp = rand(80, 430) * scale;
      this.particles.push(new Particle(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp, rand(0.3, 0.7), rand(2, 4.5), i % 3 === 0 ? "#ffffff" : color));
    }
    // 烟雾
    for (let i = 0; i < 10 * scale; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp = rand(20, 110);
      this.particles.push(new Particle(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp - 20, rand(0.6, 1.1), rand(6, 12), "#4a4a5e"));
    }
    this.screenShake = Math.max(this.screenShake, 0.35);
  }

  choiceCardLayout() {
    const cw = 164, ch = 132, gap = 24;
    return {
      cw, ch, gap,
      x0: (W - (cw * 3 + gap * 2)) / 2,
      y0: H / 2 - 52,
    };
  }

  // 根据鼠标坐标返回选中的卡片索引（-1 = 未选中；增益/道具共用布局）
  cardAt(mx, my) {
    const opts = this.rewardOptions || this.shopOptions || this.itemOptions;
    if (!opts || this.choiceAnimation || mx < 0 || my < 0) return -1;
    const { cw, ch, gap, x0, y0 } = this.choiceCardLayout();
    for (let i = 0; i < opts.length; i++) {
      const x = x0 + i * (cw + gap);
      if (mx >= x && mx <= x + cw && my >= y0 && my <= y0 + ch) return i;
    }
    return -1;
  }

  shopExitRect() {
    const { ch, y0 } = this.choiceCardLayout();
    return { x: W / 2 - 72, y: y0 + ch + 30, w: 144, h: 38 };
  }

  shopExitAt(mx, my) {
    if (this.waveState !== "shop" || this.choiceAnimation) return false;
    const r = this.shopExitRect();
    return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
  }

  choiceAccent(id) {
    return {
      hp: "#ff6b8a",
      speed: "#ffd43b",
      laser: "#6ee7ff",
      shield: "#69dbff",
      bomb: "#ff9f43",
      track: "#ffe066",
      laserCapacity: "#6ee7ff",
      bombCapacity: "#ff8c5a",
      trackRate: "#8ef0c6",
    }[id] || "#7ef0ff";
  }

  startChoiceSelection(index) {
    const opts = this.rewardOptions || this.shopOptions || this.itemOptions;
    if (!opts || this.choiceAnimation || !opts[index]) return false;
    if (this.waveState !== "reward" && this.waveState !== "shop" && this.waveState !== "item") return false;
    if (this.waveState === "shop" && this.gold < opts[index].price) {
      this.shopNotice = "金币不足";
      this.shopNoticeTimer = 1.2;
      return false;
    }
    this.choiceAnimation = {
      index,
      id: opts[index].id,
      kind: this.waveState,
      elapsed: 0,
      duration: 0.78,
    };
    this.rewardHover = -1;
    canvas.style.cursor = "default";
    return true;
  }

  drawShopIcon(type, accent, y) {
    ctx.save();
    ctx.translate(0, y);
    ctx.strokeStyle = accent;
    ctx.fillStyle = accent;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.shadowColor = accent;
    ctx.shadowBlur = 12;

    if (type === "laser") {
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(0, 18);
      ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(0, 10);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-13, -12); ctx.lineTo(-7, 0); ctx.lineTo(-13, 12);
      ctx.moveTo(13, -12); ctx.lineTo(7, 0); ctx.lineTo(13, 12);
      ctx.stroke();
    } else if (type === "bomb") {
      ctx.beginPath();
      ctx.arc(-2, 3, 13, 0, Math.PI * 2);
      ctx.stroke();
      ctx.save();
      ctx.globalAlpha *= 0.2;
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(6, -8);
      ctx.quadraticCurveTo(11, -15, 16, -12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(16, -17); ctx.lineTo(16, -12);
      ctx.moveTo(12, -15); ctx.lineTo(16, -12);
      ctx.moveTo(20, -15); ctx.lineTo(16, -12);
      ctx.stroke();
    } else if (type === "track") {
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -20); ctx.lineTo(0, -11);
      ctx.moveTo(0, 11); ctx.lineTo(0, 20);
      ctx.moveTo(-20, 0); ctx.lineTo(-11, 0);
      ctx.moveTo(11, 0); ctx.lineTo(20, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawChoiceCard(opt, cx, cy, w, h, state = {}) {
    const alpha = state.alpha ?? 1;
    if (alpha <= 0) return;
    const scale = state.scale ?? 1;
    const scaleX = state.scaleX ?? 1;
    const hover = !!state.hover;
    const selected = !!state.selected;
    const back = !!state.back;
    const disabled = !!state.disabled;
    const accent = disabled ? "#52657f" : this.choiceAccent(opt.id);

    ctx.save();
    ctx.globalAlpha = alpha * (disabled ? 0.58 : 1);
    ctx.translate(cx, cy);
    ctx.scale(Math.max(0.001, scale * scaleX), Math.max(0.001, scale));

    const x = -w / 2, y = -h / 2;
    const fill = ctx.createLinearGradient(0, y, 0, y + h);
    fill.addColorStop(0, hover || selected ? "rgba(35,61,105,0.96)" : "rgba(22,39,72,0.94)");
    fill.addColorStop(1, back ? "rgba(9,18,38,0.98)" : "rgba(11,23,47,0.98)");

    ctx.shadowColor = accent;
    ctx.shadowBlur = hover || selected ? 24 : 8;
    roundedRectPath(x, y, w, h, 7);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.shadowBlur = 0;

    roundedRectPath(x + 1, y + 1, w - 2, h - 2, 6);
    ctx.strokeStyle = hover || selected ? accent : "#35547f";
    ctx.lineWidth = hover || selected ? 2.5 : 1.25;
    ctx.stroke();

    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-26, y + 1.5);
    ctx.lineTo(26, y + 1.5);
    ctx.stroke();

    if (back) {
      ctx.save();
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.strokeRect(-17, -17, 34, 34);
      ctx.globalAlpha *= 0.45;
      ctx.strokeRect(-9, -9, 18, 18);
      ctx.restore();
    } else {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const hasPrice = Number.isFinite(opt.price);
      const iconY = hasPrice ? -27 : -18;
      if (opt.iconType) {
        this.drawShopIcon(opt.iconType, hover || selected ? "#ffffff" : accent, iconY);
      } else {
        ctx.font = "32px 'Segoe UI', sans-serif";
        ctx.fillStyle = hover || selected ? "#ffffff" : accent;
        ctx.shadowColor = accent;
        ctx.shadowBlur = hover || selected ? 14 : 5;
        ctx.fillText(opt.icon, 0, iconY);
        ctx.shadowBlur = 0;
      }
      ctx.font = "bold 19px 'Segoe UI', sans-serif";
      ctx.fillStyle = disabled ? "#8b9bb2" : hover || selected ? "#ffffff" : "#dcebff";
      ctx.fillText(opt.name, 0, hasPrice ? 16 : 28);
      if (hasPrice) {
        ctx.font = "bold 14px 'Segoe UI', sans-serif";
        ctx.fillStyle = disabled ? "#ff8d8d" : "#ffd43b";
        ctx.fillText("金币 " + opt.price.toLocaleString("zh-CN"), 0, 47);
      }
    }
    ctx.restore();
  }

  // 发射玩家激光（无前摇，消耗 1 次）
  firePlayerLaser() {
    if (this.paused || this.waveState === "modeSelect" || this.waveState === "bossVictory" || this.waveState === "gameover" || this.waveState === "reward" || this.waveState === "shop" || this.waveState === "item") return false;
    if (this.player.laserCharges <= 0) return false;
    this.player.laserCharges--;
    this.playerLasers.push({ x: this.player.x, t: 0.35, damage: 20, hit: new Set() });
    playLaserSound();
    this.screenShake = Math.max(this.screenShake, 0.15);
    return true;
  }

  gameOver() {
    this.waveState = "gameover";
    this.paused = false;
    pauseBackgroundMusic();
    this.explosion(this.player.x, this.player.y, "#4dd0ff", 1.6);
    this.screenShake = 0.5;
  }

  togglePause() {
    // 增益/商店/道具界面本身需要等待玩家操作，不额外叠加暂停状态。
    if (this.waveState === "modeSelect" || this.waveState === "bossVictory" || this.waveState === "gameover" || this.waveState === "reward" || this.waveState === "shop" || this.waveState === "item") return;
    this.paused = !this.paused;
    if (this.paused) pauseBackgroundMusic();
    else startBackgroundMusic();
  }

  pauseAudioLayout() {
    const bgmY = H / 2 + 104;
    const effectsY = H / 2 + 164;
    return {
      panel: { x: W / 2 - 220, y: H / 2 + 48, w: 440, h: 166 },
      bgm: {
        label: "背景音乐",
        mute: { x: W / 2 - 172, y: bgmY - 20, w: 40, h: 40 },
        slider: { x: W / 2 - 104, y: bgmY, w: 232, h: 8 },
      },
      effects: {
        label: "游戏音效",
        mute: { x: W / 2 - 172, y: effectsY - 20, w: 40, h: 40 },
        slider: { x: W / 2 - 104, y: effectsY, w: 232, h: 8 },
      },
    };
  }

  pauseAudioControlAt(mx, my) {
    if (!this.paused) return null;
    const { bgm, effects } = this.pauseAudioLayout();
    for (const [channel, row] of [["bgm", bgm], ["effects", effects]]) {
      const { mute, slider } = row;
      if (mx >= mute.x && mx <= mute.x + mute.w && my >= mute.y && my <= mute.y + mute.h) return channel + "Mute";
      if (mx >= slider.x - 10 && mx <= slider.x + slider.w + 10 && my >= slider.y - 14 && my <= slider.y + 14) return channel + "Slider";
    }
    return null;
  }

  drawPauseAudioControls() {
    const { panel, bgm, effects } = this.pauseAudioLayout();
    const hovered = this.pauseAudioControlAt(this.mouseX, this.mouseY);
    ctx.save();
    roundedRectPath(panel.x, panel.y, panel.w, panel.h, 10);
    ctx.fillStyle = "rgba(10,20,38,0.86)";
    ctx.fill();
    ctx.strokeStyle = "rgba(91,150,206,0.55)";
    ctx.lineWidth = 1;
    ctx.stroke();

    const drawRow = (row, volume, muted, key, color) => {
      const { mute, slider } = row;
      const muteControl = key + "Mute";
      const muteHovered = hovered === muteControl;
      ctx.fillStyle = "#9fd8ff";
      ctx.font = "14px 'Segoe UI', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(row.label, slider.x, slider.y - 16);
      ctx.textAlign = "right";
      ctx.fillText(Math.round(volume * 100) + "%", slider.x + slider.w, slider.y - 16);

      ctx.beginPath();
      ctx.arc(mute.x + mute.w / 2, mute.y + mute.h / 2, 20, 0, Math.PI * 2);
      ctx.fillStyle = muteHovered ? "rgba(77,208,255,0.28)" : "rgba(22,39,72,0.9)";
      ctx.fill();
      ctx.strokeStyle = muteHovered ? "#9fd8ff" : "#46658e";
      ctx.lineWidth = 1;
      ctx.stroke();

      const ix = mute.x + mute.w / 2, iy = mute.y + mute.h / 2;
      ctx.fillStyle = muted ? "#7f91ad" : "#dff7ff";
      ctx.beginPath();
      ctx.moveTo(ix - 11, iy - 4);
      ctx.lineTo(ix - 5, iy - 4);
      ctx.lineTo(ix + 3, iy - 11);
      ctx.lineTo(ix + 3, iy + 11);
      ctx.lineTo(ix - 5, iy + 4);
      ctx.lineTo(ix - 11, iy + 4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 2;
      if (muted) {
        ctx.beginPath();
        ctx.moveTo(ix + 7, iy - 8);
        ctx.lineTo(ix + 16, iy + 8);
        ctx.moveTo(ix + 16, iy - 8);
        ctx.lineTo(ix + 7, iy + 8);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(ix + 2, iy, 10, -0.68, 0.68);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ix + 2, iy, 15, -0.62, 0.62);
        ctx.stroke();
      }

      ctx.lineCap = "round";
      ctx.lineWidth = 7;
      ctx.strokeStyle = "rgba(50,75,110,0.95)";
      ctx.beginPath();
      ctx.moveTo(slider.x, slider.y);
      ctx.lineTo(slider.x + slider.w, slider.y);
      ctx.stroke();
      ctx.strokeStyle = muted ? "#6b7c98" : color;
      ctx.beginPath();
      ctx.moveTo(slider.x, slider.y);
      ctx.lineTo(slider.x + slider.w * volume, slider.y);
      ctx.stroke();
      ctx.lineCap = "butt";
      ctx.fillStyle = muted ? "#a9b7ca" : "#eaffff";
      ctx.beginPath();
      ctx.arc(slider.x + slider.w * volume, slider.y, 7, 0, Math.PI * 2);
      ctx.fill();
    };

    drawRow(bgm, audioSettings.bgmVolume, audioSettings.bgmMuted, "bgm", "#c0a0ff");
    drawRow(effects, audioSettings.effectsVolume, audioSettings.effectsMuted, "effects", "#4dd0ff");
    ctx.restore();
  }

  drawModeSelect() {
    ctx.save();
    ctx.fillStyle = "rgba(3,8,16,0.68)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f2fbff";
    ctx.font = "bold 38px 'Segoe UI', sans-serif";
    ctx.shadowColor = "#4dd0ff";
    ctx.shadowBlur = 18;
    ctx.fillText("选择关卡", W / 2, H / 2 - 112);
    ctx.shadowBlur = 0;
    ctx.font = "14px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#819bb8";
    ctx.fillText("按数字键或点击进入", W / 2, H / 2 - 78);

    const hovered = this.modeAt(this.mouseX, this.mouseY);
    for (const option of this.modeOptions()) {
      const active = hovered && hovered.id === option.id;
      const accent = option.id === "boss" ? "#ff5e72" : "#58e8ff";
      roundedRectPath(option.x, option.y, option.w, option.h, 7);
      ctx.fillStyle = active ? "rgba(29,50,72,0.96)" : "rgba(12,24,42,0.94)";
      ctx.shadowColor = active ? accent : "transparent";
      ctx.shadowBlur = active ? 22 : 0;
      ctx.fill();
      ctx.shadowBlur = 0;
