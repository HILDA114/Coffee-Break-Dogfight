      ctx.strokeStyle = active ? accent : "rgba(88,126,163,0.62)";
      ctx.lineWidth = active ? 2 : 1;
      ctx.stroke();
      ctx.textAlign = "left";
      ctx.font = "bold 14px ui-monospace, monospace";
      ctx.fillStyle = accent;
      ctx.fillText(option.key, option.x + 18, option.y + 28);
      ctx.textAlign = "center";
      ctx.font = "bold 23px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#edf8ff";
      ctx.fillText(option.name, option.x + option.w / 2, option.y + 66);
      ctx.font = "13px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#8da7c1";
      ctx.fillText(option.id === "boss" ? "独立 BOSS 测试" : "从第 1 波开始", option.x + option.w / 2, option.y + 94);
    }
    ctx.restore();
  }

  drawBossHUD() {
    if (!this.boss) return;
    const ratio = this.boss.healthRatio;
    const bar = { x: W / 2 - 130, y: 42, w: 260, h: 12 };
    const color = ratio > 0.66 ? "#ff596d" : ratio > 0.33 ? "#ff8b56" : "#ff334f";
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "bold 18px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#f4fbff";
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillText("无畏级", W / 2, 27);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(2,7,12,0.88)";
    ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
    ctx.strokeStyle = "rgba(205,230,240,0.45)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bar.x, bar.y, bar.w, bar.h);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillRect(bar.x + 2, bar.y + 2, (bar.w - 4) * ratio, bar.h - 4);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.32)";
    ctx.fillRect(bar.x + 2, bar.y + 2, (bar.w - 4) * ratio, 2);
    ctx.restore();
  }

  drawBossVictory() {
    ctx.save();
    ctx.fillStyle = "rgba(3,7,14,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.font = "bold 42px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#f4fbff";
    ctx.shadowColor = "#55eaff";
    ctx.shadowBlur = 20;
    ctx.fillText("星蚀母舰已击破", W / 2, H / 2 - 24);
    ctx.shadowBlur = 0;
    ctx.font = "18px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#9fd8ff";
    ctx.fillText("按 R 返回关卡选择", W / 2, H / 2 + 28);
    ctx.restore();
  }

  draw() {
    ctx.save();
    // 屏幕震动
    if (this.screenShake > 0) {
      ctx.translate(rand(-4, 4) * this.screenShake * 2, rand(-4, 4) * this.screenShake * 2);
    }

    // 背景
    ctx.fillStyle = "#060a14";
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // 星星
    for (const s of this.stars) {
      ctx.fillStyle = `rgba(200,220,255,${0.3 + (s.s / 2.2) * 0.5})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // 子弹
    for (const b of this.bullets) b.draw();
    for (const b of this.enemyBullets) b.draw();

    // 敌人
    for (const e of this.enemies) e.draw();
    if (this.boss) this.boss.draw();

    // 玩家激光（画在敌人之上）
    for (const l of this.playerLasers) {
      const topY = -10;
      const botY = this.player.y - this.player.r - 8;
      ctx.shadowColor = "#4dd0ff";
      ctx.shadowBlur = 16;
      ctx.strokeStyle = "rgba(150,235,255,0.85)";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(l.x, topY);
      ctx.lineTo(l.x, botY);
      ctx.stroke();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 自动追踪子弹
    for (const hb of this.homingBullets) {
      ctx.fillStyle = "#ffe066";
      ctx.shadowColor = "#ffd43b";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(hb.x, hb.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 炸弹（飞行中的弹体）
    if (this.bomb) {
      ctx.fillStyle = "#ff6b3d";
      ctx.shadowColor = "#ff3b30";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(this.bomb.x, this.bomb.y, this.bomb.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffd43b";
      ctx.beginPath();
      ctx.arc(this.bomb.x - 3, this.bomb.y - 3, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 玩家
    if (this.waveState !== "gameover" && this.waveState !== "modeSelect") this.player.draw();

    // 粒子 & 文字
    for (const p of this.particles) p.draw();
    for (const t of this.floatTexts) t.draw();

    // 冲击波圆环
    for (const s of this.shockwaves) {
      const a = clamp(s.life / s.maxLife, 0, 1);
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width * a + 0.5;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // ---- HUD ----
    if (this.waveState !== "modeSelect") this.drawHUD();

    // ---- 波次提示 ----
    if (this.mode === "campaign" && this.waveState === "intermission" && this.wave >= 0) {
      const next = this.wave + 1;
      const a = clamp(this.intermissionTimer / 2, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = "bold 34px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#9fd8ff";
      ctx.shadowColor = "#4dd0ff";
      ctx.shadowBlur = 18;
      if (!this.isBossWave(next)) ctx.fillText("第 " + next + " 波来袭", W / 2, H / 2 - 20);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // ---- 卡片选择界面（增益 / 商店 / 本回合道具） ----
    const cardOpts = this.rewardOptions || this.shopOptions || this.itemOptions;
    if ((this.waveState === "reward" || this.waveState === "shop" || this.waveState === "item") && cardOpts) {
      const isShop = this.waveState === "shop";
      this.rewardHover = this.cardAt(this.mouseX, this.mouseY);
      const animation = this.choiceAnimation;
      const progress = animation ? clamp(animation.elapsed / animation.duration, 0, 1) : 0;
      ctx.fillStyle = "rgba(5,8,16,0.82)";
      ctx.fillRect(-10, -10, W + 20, H + 20);

      const headingAlpha = animation ? 1 - easeOutCubic(clamp(progress / 0.5, 0, 1)) : 1;
      ctx.save();
      ctx.globalAlpha = headingAlpha;
      ctx.textAlign = "center";
      ctx.font = "bold 16px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#9fd8ff";
      if (this.waveState === "reward") {
        ctx.fillText(this.isBossWave(this.wave) ? "BOSS关通关！" : "第 " + this.wave + " 波通关！", W / 2, H / 2 - 205);
      } else if (isShop) {
        ctx.fillStyle = "#ffd43b";
        ctx.fillText("金币 " + this.gold.toLocaleString("zh-CN") + "  ·  每次限购一件", W / 2, H / 2 - 205);
      } else {
        ctx.fillText("道具仅限本回合使用，下一波重新选择", W / 2, H / 2 - 205);
      }
      ctx.font = "bold 30px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#ffd43b";
      ctx.shadowColor = "#ffd43b";
      ctx.shadowBlur = 12;
      const choiceTitle = this.waveState === "reward" ? "选择增益" : isShop ? "战备商店" : "选择本回合道具";
      ctx.fillText(choiceTitle, W / 2, H / 2 - 170);
      ctx.shadowBlur = 0;
      ctx.restore();

      const { cw, ch, gap, x0, y0 } = this.choiceCardLayout();
      const selectedBaseX = animation ? x0 + animation.index * (cw + gap) + cw / 2 : W / 2;
      cardOpts.forEach((opt, i) => {
        const baseX = x0 + i * (cw + gap) + cw / 2;
        const baseY = y0 + ch / 2;

        if (!animation) {
          const disabled = isShop && this.gold < opt.price;
          const hover = i === this.rewardHover && !disabled;
          this.drawChoiceCard(opt, baseX, baseY - (hover ? 4 : 0), cw, ch, {
            hover,
            disabled,
            scale: hover ? 1.035 : 1,
          });
          return;
        }

        if (i !== animation.index) {
          const fadeProgress = clamp(progress / 0.42, 0, 1);
          const direction = Math.sign(baseX - selectedBaseX);
          this.drawChoiceCard(opt, baseX + direction * 30 * easeOutCubic(fadeProgress), baseY, cw, ch, {
            alpha: 1 - easeOutCubic(fadeProgress),
            scale: 1 - 0.1 * fadeProgress,
          });
          return;
        }

        const travel = easeInOutCubic(progress);
        const cardX = baseX + (W / 2 - baseX) * travel;
        const cardY = baseY + (H / 2 + 12 - baseY) * travel;
        const shrinkProgress = clamp((progress - 0.18) / 0.82, 0, 1);
        const confirmBump = progress < 0.18 ? 0.055 * Math.sin((progress / 0.18) * Math.PI) : 0;
        const cardScale = Math.max(0, 1 + confirmBump - easeInCubic(shrinkProgress));
        const flipProgress = clamp(progress / 0.78, 0, 1);
        const flip = Math.cos(flipProgress * Math.PI);
        const cardAlpha = 1 - easeInCubic(clamp((progress - 0.82) / 0.18, 0, 1));

        const ringProgress = clamp(progress / 0.52, 0, 1);
        ctx.save();
        ctx.globalAlpha = (1 - ringProgress) * 0.7;
        ctx.strokeStyle = this.choiceAccent(opt.id);
        ctx.lineWidth = 2.5 * (1 - ringProgress) + 0.5;
        roundedRectPath(
          cardX - cw / 2 - 22 * ringProgress,
          cardY - ch / 2 - 14 * ringProgress,
          cw + 44 * ringProgress,
          ch + 28 * ringProgress,
          7 + 5 * ringProgress
        );
        ctx.stroke();
        ctx.restore();

        this.drawChoiceCard(opt, cardX, cardY, cw, ch, {
          alpha: cardAlpha,
          scale: cardScale,
          scaleX: Math.max(0.035, Math.abs(flip)),
          selected: true,
          back: flip < 0,
        });
      });

      if (isShop && !animation) {
        const exit = this.shopExitRect();
        const exitHover = this.shopExitAt(this.mouseX, this.mouseY);
        ctx.save();
        roundedRectPath(exit.x, exit.y, exit.w, exit.h, 6);
        ctx.fillStyle = exitHover ? "rgba(73,103,145,0.72)" : "rgba(22,39,72,0.78)";
        ctx.fill();
        ctx.strokeStyle = exitHover ? "#9fd8ff" : "#46658e";
        ctx.lineWidth = exitHover ? 2 : 1;
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 15px 'Segoe UI', sans-serif";
        ctx.fillStyle = exitHover ? "#ffffff" : "#b8cbe5";
        ctx.fillText("跳过商店", exit.x + exit.w / 2, exit.y + exit.h / 2);
        if (this.shopNoticeTimer > 0) {
          ctx.globalAlpha = clamp(this.shopNoticeTimer / 0.3, 0, 1);
          ctx.font = "bold 15px 'Segoe UI', sans-serif";
          ctx.fillStyle = "#ff8d8d";
          ctx.fillText(this.shopNotice, W / 2, exit.y + exit.h + 25);
        }
        ctx.restore();
      }
    }

    // ---- 结算画面 ----
    if (this.waveState === "gameover") {
      ctx.fillStyle = "rgba(5,8,16,0.72)";
      ctx.fillRect(-10, -10, W + 20, H + 20);
      ctx.textAlign = "center";
      ctx.font = "bold 44px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#ff6b6b";
      ctx.shadowColor = "#ff6b6b";
      ctx.shadowBlur = 20;
      ctx.fillText("游戏结束", W / 2, H / 2 - 60);
      ctx.shadowBlur = 0;
      ctx.font = "22px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#cfe3ff";
      const resultText = this.mode === "boss"
        ? "星蚀母舰剩余生命 " + Math.ceil((this.boss?.healthRatio || 0) * 100) + "%"
        : "金币: " + this.gold.toLocaleString("zh-CN") + "   到达波次: " + this.wave;
      ctx.fillText(resultText, W / 2, H / 2 - 10);
      ctx.font = "18px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#7ef0ff";
      ctx.fillText("按 R 键重新开始", W / 2, H / 2 + 40);
    }

    if (this.waveState === "bossVictory") this.drawBossVictory();
    if (this.waveState === "modeSelect") this.drawModeSelect();

    // ---- 暂停画面 ----
    if (this.paused) {
      ctx.fillStyle = "rgba(5,8,16,0.68)";
      ctx.fillRect(-10, -10, W + 20, H + 20);
      ctx.textAlign = "center";
      ctx.font = "bold 42px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#cfe3ff";
      ctx.shadowColor = "#4dd0ff";
      ctx.shadowBlur = 18;
      ctx.fillText("游戏暂停", W / 2, H / 2 - 18);
      ctx.shadowBlur = 0;
      ctx.font = "18px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#9fd8ff";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
      this.drawPauseAudioControls();
    }

    ctx.restore();
  }

  drawHUD() {
    // 玩家机体完整度 HUD：核心图标 + 分段能量槽 + 数值读数。
    const ratio = clamp(this.player.hp / this.player.maxHp, 0, 1);
    const panel = { x: 14, y: 12, w: 252, h: 58 };
    const core = { x: panel.x + 27, y: panel.y + 29 };
    const bar = { x: panel.x + 51, y: panel.y + 31, w: 174, h: 13 };
    const hpColor = ratio > 0.5 ? "#50e3c2" : ratio > 0.25 ? "#ffd166" : "#ff5e7a";
    const pulse = ratio <= 0.25 ? 0.5 + 0.5 * Math.sin(this.time * 9) : 0;

    ctx.save();
    roundedRectPath(panel.x, panel.y, panel.w, panel.h, 11);
    ctx.fillStyle = "rgba(7,16,30,0.88)";
    ctx.fill();
    ctx.strokeStyle = ratio <= 0.25
      ? `rgba(255,94,122,${(0.52 + pulse * 0.32).toFixed(3)})`
      : "rgba(91,150,206,0.62)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 左侧机体核心，受击无敌时显示短暂的亮环。
    ctx.beginPath();
    ctx.arc(core.x, core.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(17,38,62,0.95)";
    ctx.fill();
    ctx.strokeStyle = this.player.invuln > 0 ? "#eaffff" : hpColor;
    ctx.lineWidth = this.player.invuln > 0 ? 2.4 : 1.6;
    ctx.shadowColor = this.player.invuln > 0 ? "#eaffff" : hpColor;
    ctx.shadowBlur = this.player.invuln > 0 ? 12 : 7;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(core.x, core.y - 9);
    ctx.lineTo(core.x + 7, core.y + 7);
    ctx.lineTo(core.x, core.y + 4);
    ctx.lineTo(core.x - 7, core.y + 7);
    ctx.closePath();
    ctx.fillStyle = hpColor;
    ctx.fill();

    ctx.textAlign = "left";
    ctx.font = "10px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#8eaaca";
    ctx.fillText("机体完整度", bar.x, panel.y + 17);
    ctx.textAlign = "right";
    ctx.font = "bold 15px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#eaffff";
    ctx.fillText("HP " + Math.ceil(this.player.hp) + " / " + this.player.maxHp, panel.x + panel.w - 14, panel.y + 18);

    // 分段槽让剩余生命更容易在战斗中被快速扫读。
    const segments = 12;
    const gap = 3;
    const segmentW = (bar.w - gap * (segments - 1)) / segments;
    const filled = ratio * segments;
    for (let i = 0; i < segments; i++) {
      const x = bar.x + i * (segmentW + gap);
      ctx.fillStyle = "rgba(43,69,95,0.9)";
      ctx.fillRect(x, bar.y, segmentW, bar.h);
      const amount = clamp(filled - i, 0, 1);
      if (amount > 0) {
        ctx.fillStyle = hpColor;
        ctx.shadowColor = hpColor;
        ctx.shadowBlur = ratio <= 0.25 ? 8 : 4;
        ctx.fillRect(x, bar.y, segmentW * amount, bar.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,0.32)";
        ctx.fillRect(x, bar.y, segmentW * amount, 2);
      }
    }
    ctx.restore();

    if (this.mode === "boss" || this.isCampaignBossState()) {
      if (this.boss) {
        this.drawBossHUD();
      } else {
        ctx.textAlign = "right";
        ctx.font = "bold 20px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#ff9f66";
        ctx.fillText("BOSS关", W - 16, 32);
      }
    } else {
      // 金币 & 波次（右上）
      ctx.textAlign = "right";
      ctx.font = "bold 20px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#ffd43b";
      ctx.fillText("金币 " + this.gold.toLocaleString("zh-CN"), W - 16, 32);
      ctx.font = "15px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#9fd8ff";
      ctx.fillText("波次 " + this.wave + (this.waveState === "fighting" ? "  ·  击杀 " + this.waveKills + "/" + this.waveQuota : ""), W - 16, 54);
    }

    // 激光剩余次数（左下角）
    ctx.textAlign = "left";
    ctx.font = "bold 17px 'Segoe UI', sans-serif";
    ctx.fillStyle = this.player.laserCharges > 0 ? "#7ef0ff" : "#557799";
    ctx.fillText("◉ 激光 " + this.player.laserCharges + " / " + this.player.maxLaserCharges, 16, H - 18);

    // 本回合道具（左下角）
    if (this.item) {
      ctx.font = "bold 15px 'Segoe UI', sans-serif";
      if (this.item.id === "shield") {
        ctx.fillStyle = this.player.shield > 0 ? "#7ef0ff" : "#557799";
        ctx.fillText("◈ 护盾 " + this.player.shield, 16, H - 42);
      } else if (this.item.id === "bomb") {
        ctx.fillStyle = this.item.count > 0 ? "#ff9f43" : "#557799";
        ctx.fillText("● 炸弹 " + this.item.count + " / " + this.player.bombCapacity + "（按 X 投掷）", 16, H - 42);
      } else if (this.item.id === "track") {
        ctx.fillStyle = "#ffe066";
        ctx.fillText("◎ 自动追踪 " + this.player.trackShotsPerSecond + " 发/秒", 16, H - 42);
      }
    }
  }
}

// ---------- 输入 ----------
const input = { left: false, right: false, up: false, down: false };
let volumeSliderDragging = null;

function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height),
  };
}

function updateVolumeFromPointer(e) {
  if (!game || !game.paused || !volumeSliderDragging) return;
  const point = canvasPoint(e);
  const row = game.pauseAudioLayout()[volumeSliderDragging];
  const value = (point.x - row.slider.x) / row.slider.w;
  if (volumeSliderDragging === "bgm") setBgmVolume(value, true);
  else setEffectsVolume(value, true);
}

// 选择当前卡片（增益或道具，1/2/3 键与鼠标点击共用）
function chooseCard(i) {
  if (!game) return;
  game.startChoiceSelection(i);
}

window.addEventListener("keydown", (e) => {
  ensureAudio();
  if (game && game.waveState === "modeSelect") {
    if (e.code === "Digit1" || e.code === "Numpad1") game.selectMode("campaign");
    else if (e.code === "Digit2" || e.code === "Numpad2") game.selectMode("boss");
    return;
  }
  switch (e.code) {
    case "Escape":
      e.preventDefault();
      if (game) game.togglePause();
      break;
    case "ArrowLeft": case "KeyA": input.left = true; break;
    case "ArrowRight": case "KeyD": input.right = true; break;
    case "ArrowUp": case "KeyW": input.up = true; break;
    case "ArrowDown": case "KeyS": input.down = true; break;
    case "Space":
      e.preventDefault();
      if (game) game.firePlayerLaser();
      break;
    case "KeyX":
      e.preventDefault();
      if (game) game.launchBomb();
      break;
    case "Digit1": case "Numpad1": chooseCard(0); break;
    case "Digit2": case "Numpad2": chooseCard(1); break;
    case "Digit3": case "Numpad3": chooseCard(2); break;
    case "KeyR":
      if (game && (game.waveState === "gameover" || game.waveState === "bossVictory")) {
        game = new Game();
        startBackgroundMusic();
      }
      break;
  }
});
canvas.addEventListener("pointerdown", (e) => {
  ensureAudio();
  if (!game || !game.paused) return;
  const point = canvasPoint(e);
  const control = game.pauseAudioControlAt(point.x, point.y);
  if (control === "bgmSlider" || control === "effectsSlider") {
    volumeSliderDragging = control === "bgmSlider" ? "bgm" : "effects";
    canvas.setPointerCapture?.(e.pointerId);
    updateVolumeFromPointer(e);
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (volumeSliderDragging) updateVolumeFromPointer(e);
});
window.addEventListener("pointerup", () => { volumeSliderDragging = null; });
window.addEventListener("keyup", (e) => {
  switch (e.code) {
    case "ArrowLeft": case "KeyA": input.left = false; break;
    case "ArrowRight": case "KeyD": input.right = false; break;
    case "ArrowUp": case "KeyW": input.up = false; break;
    case "ArrowDown": case "KeyS": input.down = false; break;
  }
});

// 鼠标：悬停高亮 + 点击选择增益
canvas.addEventListener("mousemove", (e) => {
  if (!game) return;
  const rect = canvas.getBoundingClientRect();
  game.mouseX = (e.clientX - rect.left) * (W / rect.width);
  game.mouseY = (e.clientY - rect.top) * (H / rect.height);
  const interactive = !!game.modeAt(game.mouseX, game.mouseY) || game.cardAt(game.mouseX, game.mouseY) >= 0 || game.shopExitAt(game.mouseX, game.mouseY) || !!game.pauseAudioControlAt(game.mouseX, game.mouseY);
  canvas.style.cursor = interactive ? "pointer" : "default";
});
canvas.addEventListener("click", (e) => {
  if (!game) return;
  const { x: mx, y: my } = canvasPoint(e);
  const modeOption = game.modeAt(mx, my);
  if (modeOption) {
    game.selectMode(modeOption.id);
    return;
  }
  const pauseControl = game.pauseAudioControlAt(mx, my);
  if (pauseControl === "bgmMute") {
    toggleBgmMute();
    return;
  }
  if (pauseControl === "effectsMute") {
    toggleEffectsMute();
    return;
  }
  if (pauseControl === "bgmSlider" || pauseControl === "effectsSlider") {
    const row = game.pauseAudioLayout()[pauseControl === "bgmSlider" ? "bgm" : "effects"];
    const value = (mx - row.slider.x) / row.slider.w;
    if (pauseControl === "bgmSlider") setBgmVolume(value, true);
    else setEffectsVolume(value, true);
    return;
  }
  const i = game.cardAt(mx, my);
  if (i >= 0) chooseCard(i);
  else if (game.shopExitAt(mx, my)) game.leaveShop();
});

// ---------- 主循环 ----------
let last = performance.now();
game = new Game();

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  game.update(dt, input);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
